<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Signs Quiz | DriveFlow</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-elevated: #1c2541;
        --bg-card: #2d3f5a;
        --bg-card-soft: #2d3f5a;
        --bg-card-smaller: #3a506b;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --border-strong: rgba(111, 255, 233, 0.7);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --accent-orange: #f97316;
        --accent-red: #ef4444;
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --text-soft: #6b7280;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
        --blur: 18px;
        --button-bg: #6fffe9;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        max-width: 1400px;
        margin: 96px auto 40px;
        padding: 0 20px 40px;
    }

    .page-header {
        position: relative;
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 40px;
        text-align: center;
    }

    .page-header h1 {
        margin: 0 0 12px;
        color: var(--text-main);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
    }

    .progress-bar {
        width: 100%;
        height: 8px;
        background: #32445c;
        border-radius: 4px;
        margin-bottom: 30px;
        overflow: hidden;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-subtle);
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
    }

    .progress-fill {
        height: 100%;
        background: var(--button-bg);
        transition: width 0.4s ease;
        border-radius: 4px;
    }

    .question-card {
        position: relative;
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 32px;
        margin-bottom: 24px;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
    }

    .question-number {
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 16px;
    }

    .quiz-question {
        font-size: 20px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 24px;
        line-height: 1.6;
    }

    .question-sign-container {
        text-align: center;
        margin-bottom: 32px;
    }

    .question-sign-image {
        max-width: 100%;
        height: auto;
        border-radius: var(--radius-lg);
        margin: 0 auto;
        display: block;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .options-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 24px;
    }

    .option-button {
        padding: 16px 24px;
        border-radius: 12px;
        border: 1px solid var(--border-subtle);
        background: rgba(15, 23, 42, 0.4);
        color: var(--text-main);
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: left;
    }

    .option-button:hover:not(:disabled) {
        background: var(--primary-soft);
        border-color: var(--primary);
        transform: translateX(4px);
    }

    .option-button:disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }

    .option-button.correct {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
    }

    .option-button.incorrect {
        background: rgba(239, 68, 68, 0.18);
        border-color: var(--accent-red);
        color: var(--accent-red);
    }


    .feedback {
        margin-top: 24px;
        padding: 20px;
        border-radius: 12px;
        display: none;
    }

    .feedback.show {
        display: block;
    }

    .feedback.correct {
        background: var(--accent-soft);
        border: 1px solid var(--accent);
        color: var(--accent);
    }

    .feedback.incorrect {
        background: rgba(239, 68, 68, 0.18);
        border: 1px solid var(--accent-red);
        color: var(--accent-red);
    }

    .feedback-text {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .button-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border-subtle);
    }

    .btn-previous {
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text-main);
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-previous:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
        border-color: rgba(129, 140, 248, 0.8);
    }

    .btn-submit {
        border: 1px solid rgba(99, 102, 241, 0.9);
        background: linear-gradient(120deg, rgba(37, 99, 235, 0.95), rgba(124, 58, 237, 0.95));
        color: white;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 16px 40px rgba(30, 64, 175, 0.85);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-submit:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 20px 50px rgba(30, 64, 175, 0.95);
    }

    .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .btn-continue {
        border: 1px solid rgba(99, 102, 241, 0.9);
        background: linear-gradient(120deg, rgba(37, 99, 235, 0.95), rgba(124, 58, 237, 0.95));
        color: white;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 16px 40px rgba(30, 64, 175, 0.85);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-continue:hover {
        transform: translateY(-1px);
        box-shadow: 0 20px 50px rgba(30, 64, 175, 0.95);
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.18s ease-out;
    }

    .btn-back:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
        border-color: rgba(129, 140, 248, 0.8);
    }

    @media (max-width: 1024px) {
        .content-layout {
            grid-template-columns: 1fr;
        }
        
        .pdf-container {
            height: 400px;
        }
    }
</style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1>Road Signs Quiz</h1>
        <p>Test your knowledge of Irish road signs</p>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Questions Container -->
    <div id="questions-container">
        <!-- Questions will be inserted here -->
    </div>

    <div style="text-align: center;">
        <a href="drivingtest-theory.html" class="btn-back">← Back to Test Theory</a>
    </div>
</div>

<script>
    let allSignNames = [];
    let questions = [];
    let currentQuestionIndex = 0;
    let selectedAnswers = {}; // Currently selected (not yet submitted)
    let userAnswers = {}; // Submitted answers
    const TOTAL_QUESTIONS = 10; // Number of questions to show

    // Load sign names from signs.txt
    async function loadSignNames() {
        try {
            const response = await fetch('signs.txt');
            if (!response.ok) {
                throw new Error('Failed to fetch signs.txt');
            }
            const text = await response.text();
            const lines = text.split('\n');
            allSignNames = [];
            
            for (let i = 0; i < lines.length; i++) {
                const trimmed = lines[i].trim();
                const cleaned = trimmed.replace(/^\d+\.\s*/, '');
                if (cleaned.length > 0) {
                    allSignNames.push(cleaned);
                }
            }
            
            // Generate questions
            generateQuestions();
        } catch (error) {
            console.error('Error loading signs:', error);
            document.getElementById('questions-container').innerHTML = '<div class="question-card">Error loading sign names. Please ensure signs.txt exists.</div>';
        }
    }

    // Get valid sign numbers (excluding 69)
    function getValidSignNumbers() {
        const validSignNumbers = [];
        for (let i = 1; i <= 141; i++) {
            if (i !== 69) {
                validSignNumbers.push(i);
            }
        }
        return validSignNumbers;
    }

    // Get sign name index from sign number
    function getSignNameIndex(signNumber) {
        if (signNumber <= 68) {
            return signNumber - 1;
        } else {
            return signNumber - 2;
        }
    }

    // Generate questions
    function generateQuestions() {
        const validSignNumbers = getValidSignNumbers();
        const usedSigns = new Set();
        
        questions = [];
        for (let i = 0; i < TOTAL_QUESTIONS; i++) {
            // Pick a random sign number
            let signNumber;
            do {
                signNumber = validSignNumbers[Math.floor(Math.random() * validSignNumbers.length)];
            } while (usedSigns.has(signNumber));
            usedSigns.add(signNumber);
            
            const correctIndex = getSignNameIndex(signNumber);
            const correctAnswer = allSignNames[correctIndex];
            
            // Get 3 wrong answers
            const wrongSignNumbers = [];
            while (wrongSignNumbers.length < 3) {
                const randomNum = validSignNumbers[Math.floor(Math.random() * validSignNumbers.length)];
                if (!usedSigns.has(randomNum) && randomNum !== signNumber) {
                    wrongSignNumbers.push(randomNum);
                }
            }
            
            const wrongAnswers = wrongSignNumbers.map(num => allSignNames[getSignNameIndex(num)]);
            const options = [correctAnswer, ...wrongAnswers];
            
            // Shuffle options
            for (let j = options.length - 1; j > 0; j--) {
                const k = Math.floor(Math.random() * (j + 1));
                [options[j], options[k]] = [options[k], options[j]];
            }
            
            const correctAnswerIndex = options.indexOf(correctAnswer);
            
            questions.push({
                id: i + 1,
                signNumber: signNumber,
                question: 'What is the name of this sign?',
                options: options,
                correctAnswer: correctAnswerIndex,
                correctAnswerText: correctAnswer
            });
        }
        
        renderCurrentQuestion();
        updateProgress();
    }

    // Load image with fallback extensions
    function loadImageWithFallback(signNumber, imgElement) {
        const extensions = ['png', 'jpeg', 'jpg', 'webp'];
        let tried = 0;
        
        const tryNext = () => {
            if (tried >= extensions.length) {
                if (imgElement.parentElement) {
                    imgElement.parentElement.style.display = 'none';
                }
                return;
            }
            const path = `All signs test day/${signNumber}.${extensions[tried]}`;
            imgElement.src = path;
            tried++;
        };
        
        imgElement.onerror = tryNext;
        imgElement.onload = () => {
            if (imgElement.parentElement) {
                imgElement.parentElement.style.display = 'block';
            }
        };
        
        tryNext();
    }

    function renderCurrentQuestion() {
        if (currentQuestionIndex >= questions.length) {
            showCompletion();
            return;
        }

        const container = document.getElementById('questions-container');
        const q = questions[currentQuestionIndex];
        const hasSubmitted = userAnswers[currentQuestionIndex] !== undefined;
        const submittedAnswer = userAnswers[currentQuestionIndex];
        const selectedAnswer = selectedAnswers[currentQuestionIndex];
        const isCorrect = hasSubmitted && submittedAnswer === q.correctAnswer;

        // Image
        const imageHtml = `<div class="question-sign-container" style="display:none;">
            <img src="" alt="Road Sign" class="question-sign-image" data-sign-number="${q.signNumber}">
        </div>`;

        // Options
        const optionsHtml = q.options.map((opt, optIndex) => {
            const isChecked = hasSubmitted ? (submittedAnswer === optIndex) : (selectedAnswer === optIndex);
            let classes = 'option-button';
            
            if (hasSubmitted) {
                if (optIndex === q.correctAnswer) {
                    classes += ' correct';
                } else if (optIndex === submittedAnswer && optIndex !== q.correctAnswer) {
                    classes += ' incorrect';
                }
            }
            
            const isDisabled = hasSubmitted;
            
            return `
                <button class="${classes}" 
                        ${!hasSubmitted ? `onclick="selectAnswer(${optIndex})"` : ''}
                        ${isDisabled ? 'disabled' : ''}>
                    ${opt}
                </button>
            `;
        }).join('');

        // Button container
        let buttonContainerHtml = '';
        let hasPrevious = currentQuestionIndex > 0;
        
        if (!hasSubmitted) {
            buttonContainerHtml = `
                <div class="button-container">
                    ${hasPrevious ? `<button class="btn-previous" onclick="previousQuestion()">← Previous</button>` : '<div style="flex: 1;"></div>'}
                    ${selectedAnswer !== undefined ? `<button class="btn-submit" onclick="submitAnswer()">Submit Answer</button>` : '<div style="flex: 1;"></div>'}
                </div>
            `;
        } else {
            buttonContainerHtml = `
                <div class="button-container">
                    ${hasPrevious ? `<button class="btn-previous" onclick="previousQuestion()">← Previous</button>` : '<div style="flex: 1;"></div>'}
                    <button class="btn-continue" onclick="continueQuestion()">
                        ${currentQuestionIndex < questions.length - 1 ? 'Continue →' : 'Finish Quiz'}
                    </button>
                </div>
            `;
        }

        // Feedback
        let feedbackHtml = '';
        if (hasSubmitted) {
            const feedbackClass = isCorrect ? 'correct' : 'incorrect';
            const feedbackIcon = isCorrect ? '✓' : '✗';
            const feedbackText = isCorrect ? 'Correct!' : 'Incorrect';
            
            feedbackHtml = `
                <div class="feedback ${feedbackClass} show">
                    <div class="feedback-text">${feedbackIcon} ${feedbackText}</div>
                    ${!isCorrect ? `<div class="feedback-text" style="margin-top: 8px;">The correct answer is: ${q.correctAnswerText}</div>` : ''}
                </div>
            `;
        }

        // Preserve image container if it exists and is for the same question
        const existingImageContainer = container.querySelector('.question-sign-container');
        const existingImg = existingImageContainer?.querySelector(`img[data-sign-number="${q.signNumber}"]`);
        const isSameQuestion = existingImg !== null;
        
        // Only update the question card, preserve image if it's the same question
        const questionCardHtml = `
            <div class="question-card">
                <div class="question-number">Question ${currentQuestionIndex + 1} of ${questions.length}</div>
                <div class="quiz-question">${q.question}</div>
                <div class="options-container">${optionsHtml}</div>
                ${buttonContainerHtml}
                ${feedbackHtml}
            </div>
        `;
        
        if (isSameQuestion) {
            // Same question - only update the question card, keep image
            const questionCard = container.querySelector('.question-card');
            if (questionCard) {
                questionCard.outerHTML = questionCardHtml;
            }
        } else {
            // Different question or no image - replace everything
            container.innerHTML = `
                ${imageHtml}
                ${questionCardHtml}
            `;
            
            // Setup image loading safely after DOM is updated
            const imgElement = container.querySelector(`img[data-sign-number="${q.signNumber}"]`);
            if (imgElement) {
                loadImageWithFallback(q.signNumber, imgElement);
            }
        }
    }

    function selectAnswer(optionIndex) {
        if (userAnswers[currentQuestionIndex] !== undefined) return;
        
        // Toggle behavior: if clicking the same option, deselect it
        if (selectedAnswers[currentQuestionIndex] === optionIndex) {
            selectedAnswers[currentQuestionIndex] = undefined;
        } else {
            selectedAnswers[currentQuestionIndex] = optionIndex;
        }
        
        renderCurrentQuestion();
    }

    function submitAnswer() {
        if (selectedAnswers[currentQuestionIndex] === undefined) return;
        userAnswers[currentQuestionIndex] = selectedAnswers[currentQuestionIndex];
        renderCurrentQuestion();
    }

    function previousQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderCurrentQuestion();
            updateProgress();
        }
    }

    function continueQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            renderCurrentQuestion();
            updateProgress();
        } else {
            showCompletion();
        }
    }

    function updateProgress() {
        const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
    }

    function showCompletion() {
        const correct = Object.keys(userAnswers).filter(i => 
            userAnswers[i] === questions[i].correctAnswer
        ).length;
        const total = questions.length;
        const percentage = Math.round((correct / total) * 100);

        document.getElementById('questions-container').innerHTML = `
            <div class="question-card">
                <h2 style="text-align: center; margin-bottom: 16px;">Quiz Complete!</h2>
                <p style="text-align: center; font-size: 18px; margin-bottom: 24px;">
                    You got ${correct} out of ${total} questions correct (${percentage}%)
                </p>
                <div class="button-container">
                    <div style="flex: 1;"></div>
                    <button class="btn-continue" onclick="location.reload()">Take Another Quiz</button>
                </div>
            </div>
        `;
        document.getElementById('progressFill').style.width = '100%';
    }

    // Load on page load
    loadSignNames();
</script>

<script src="chatbot-widget.js"></script>

</body>
</html>
