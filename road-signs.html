<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Signs Quiz | DriveFlow</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-elevated: #1c2541;
        --bg-card: #2d3f5a;
        --bg-card-soft: #2d3f5a;
        --bg-card-smaller: #3a506b;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --border-strong: rgba(111, 255, 233, 0.7);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --accent-orange: #f97316;
        --accent-red: #ef4444;
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --text-soft: #6b7280;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
        --blur: 18px;
        --button-bg: #6fffe9;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        max-width: 1400px;
        margin: 96px auto 40px;
        padding: 0 20px 40px;
    }

    .page-header {
        position: relative;
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 40px;
        text-align: center;
    }

    .page-header h1 {
        margin: 0 0 12px;
        color: var(--text-main);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
    }

    .quiz-section {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 32px;
        max-width: 900px;
        margin: 0 auto;
    }


    .quiz-question {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 32px;
        text-align: center;
    }

    .options-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 24px;
    }

    .option-button {
        padding: 16px 24px;
        border-radius: 12px;
        border: 1px solid var(--border-subtle);
        background: rgba(15, 23, 42, 0.4);
        color: var(--text-main);
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: left;
    }

    .option-button:hover:not(:disabled) {
        background: var(--primary-soft);
        border-color: var(--primary);
        transform: translateX(4px);
    }

    .option-button:disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }

    .option-button.correct {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
    }

    .option-button.incorrect {
        background: rgba(239, 68, 68, 0.18);
        border-color: var(--accent-red);
        color: var(--accent-red);
    }


    .feedback {
        margin-top: 24px;
        padding: 20px;
        border-radius: 12px;
        display: none;
    }

    .feedback.show {
        display: block;
    }

    .feedback.correct {
        background: var(--accent-soft);
        border: 1px solid var(--accent);
        color: var(--accent);
    }

    .feedback.incorrect {
        background: rgba(239, 68, 68, 0.18);
        border: 1px solid var(--accent-red);
        color: var(--accent-red);
    }

    .feedback-text {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .next-button {
        width: 100%;
        padding: 14px;
        border-radius: 999px;
        border: 1px solid var(--primary);
        background: var(--primary);
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 24px;
    }

    .next-button:hover {
        background: var(--primary-blue-dark);
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .next-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.18s ease-out;
    }

    .btn-back:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
        border-color: rgba(129, 140, 248, 0.8);
    }

    @media (max-width: 1024px) {
        .content-layout {
            grid-template-columns: 1fr;
        }
        
        .pdf-container {
            height: 400px;
        }
    }
</style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1>Road Signs Quiz</h1>
        <p>Test your knowledge of Irish road signs</p>
    </div>

    <!-- Quiz Section -->
    <div class="quiz-section">
        <div class="quiz-question" id="questionText">
            What is the name of sign <span id="signNumber">1</span>?
        </div>

        <div class="question-sign-container">
            <img id="questionSignImage" class="question-sign-image" src="" alt="Road Sign">
        </div>
        
        <div class="options-container" id="optionsContainer">
            <!-- Options will be inserted here -->
        </div>

            <div class="feedback" id="feedback">
                <div class="feedback-text" id="feedbackText"></div>
            </div>

            <button class="next-button" id="nextButton" onclick="nextQuestion()" disabled>Next Question</button>
    </div>

    <div style="text-align: center;">
        <a href="drivingtest-theory.html" class="btn-back">← Back to Test Theory</a>
    </div>
</div>

<script>
    let allSignNames = [];
    let currentSignNumber = 1;
    let currentCorrectAnswer = '';
    let selectedAnswer = null;
    let questionAnswered = false;

    // Load sign names from signs.txt
    // Signs are ordered 1-141, where sign number N corresponds to line N
    // Line 69 contains sign 70 (accounting for missing sign 69)
    async function loadSignNames() {
        try {
            const response = await fetch('signs.txt');
            if (!response.ok) {
                throw new Error('Failed to fetch signs.txt');
            }
            const text = await response.text();
            // Split by newlines - each line corresponds to a sign
            // Line 1 = Sign 1, Line 2 = Sign 2, ..., Line 68 = Sign 68, Line 69 = Sign 70, etc.
            const lines = text.split('\n');
            allSignNames = [];
            
            for (let i = 0; i < lines.length; i++) {
                const trimmed = lines[i].trim();
                // Remove line numbers if present (e.g., "1. No Entry" -> "No Entry")
                const cleaned = trimmed.replace(/^\d+\.\s*/, '');
                if (cleaned.length > 0) {
                    allSignNames.push(cleaned);
                }
            }
            
            // Generate first question
            generateQuestion();
        } catch (error) {
            console.error('Error loading signs:', error);
            document.getElementById('questionText').innerHTML = 'Error loading sign names. Please ensure signs.txt exists.';
        }
    }

    // Map of sign numbers to their actual file extensions (prevents failed requests)
    const signImageExtensions = {
        10: 'jpeg', 32: 'jpeg', 59: 'jpeg', 60: 'jpeg', 61: 'jpeg', 62: 'jpeg', 65: 'jpeg', 68: 'jpeg',
        71: 'webp', 72: 'webp', 73: 'webp', 74: 'jpeg', 77: 'jpg', 78: 'svg.png', 80: 'jpeg',
        129: 'webp', 130: 'webp', 131: 'webp', 132: 'webp', 133: 'webp', 134: 'webp', 135: 'webp', 136: 'webp'
    };

    // Get the correct image path for a sign number
    function getSignImagePath(signNumber) {
        const extension = signImageExtensions[signNumber] || 'png';
        return `All signs test day/${signNumber}.${extension}`;
    }

    // Generate a random question
    function generateQuestion() {
        // Reset state
        selectedAnswer = null;
        questionAnswered = false;
        document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
        document.getElementById('nextButton').disabled = true;
        
        // Get valid sign numbers (excluding 69)
        // The txt file has 140 lines, but we need to account for missing sign 69
        // So valid signs are 1-68 and 70-141 (141 total signs, but 69 is missing)
        const validSignNumbers = [];
        for (let i = 1; i <= 141; i++) {
            if (i !== 69) { // Skip sign 69
                validSignNumbers.push(i);
            }
        }
        
        // Pick a random sign number from valid ones
        const randomIndex = Math.floor(Math.random() * validSignNumbers.length);
        currentSignNumber = validSignNumbers[randomIndex];
        document.getElementById('signNumber').textContent = currentSignNumber;
        
        // Get the correct answer - sign number maps directly to txt file line
        // The txt file already accounts for missing 69, so:
        // Sign 1-68 map to lines 1-68 (indices 0-67)
        // Sign 70+ map to lines 69+ (indices 68+)
        let correctIndex;
        if (currentSignNumber <= 68) {
            correctIndex = currentSignNumber - 1;
        } else {
            // Sign 70 = line 69 in txt (index 68), Sign 71 = line 70 (index 69), etc.
            correctIndex = currentSignNumber - 2;
        }
        currentCorrectAnswer = allSignNames[correctIndex];
        
        // Display the sign number in the question
        document.getElementById('signNumber').textContent = currentSignNumber;
        
        // Get the question sign image
        const imagePath = getSignImagePath(currentSignNumber);
        const imgElement = document.getElementById('questionSignImage');
        imgElement.src = imagePath;
        imgElement.onerror = function() {
            this.style.display = 'none';
        };
        imgElement.style.display = '';
        
        // Get 3 wrong answer sign numbers (excluding the correct one and 69)
        const wrongSignNumbers = [];
        const usedNumbers = new Set([currentSignNumber]);
        
        while (wrongSignNumbers.length < 3) {
            const randomNum = validSignNumbers[Math.floor(Math.random() * validSignNumbers.length)];
            if (!usedNumbers.has(randomNum)) {
                wrongSignNumbers.push(randomNum);
                usedNumbers.add(randomNum);
            }
        }
        
        // Render options with images
        renderOptionsWithImages(currentSignNumber, wrongSignNumbers);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function renderOptionsWithImages(correctSignNum, wrongSignNums) {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        
        // Get sign names for all options
        let correctIndex = correctSignNum <= 68 ? correctSignNum - 1 : correctSignNum - 2;
        const correctName = allSignNames[correctIndex];
        
        const wrongNames = wrongSignNums.map(signNum => {
            let index = signNum <= 68 ? signNum - 1 : signNum - 2;
            return allSignNames[index];
        });
        
        // Create options array with sign names
        const options = [
            { name: correctName, isCorrect: true, signNum: correctSignNum },
            ...wrongNames.map((name, idx) => ({ name: name, isCorrect: false, signNum: wrongSignNums[idx] }))
        ];
        
        // Shuffle options
        shuffleArray(options);
        
        options.forEach((option) => {
            const button = document.createElement('button');
            button.className = 'option-button';
            button.textContent = option.name;
            button.onclick = () => selectAnswerBySignNum(option.signNum, option.isCorrect, button);
            button.dataset.signNum = option.signNum;
            
            container.appendChild(button);
        });
    }

    function selectAnswerBySignNum(signNum, isCorrect, buttonElement) {
        if (questionAnswered) return;
        
        selectedAnswer = signNum;
        questionAnswered = true;
        
        // Disable all buttons
        document.querySelectorAll('.option-button').forEach(btn => {
            btn.disabled = true;
            // Find the correct answer button
            const btnSignNum = getSignNumFromButton(btn);
            if (btnSignNum === currentSignNumber) {
                btn.classList.add('correct');
            } else if (btn === buttonElement && !isCorrect) {
                btn.classList.add('incorrect');
            }
        });
        
        // Show feedback
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedbackText');
        
        if (isCorrect) {
            feedback.classList.add('show', 'correct');
            feedbackText.textContent = '✓ Correct! Well done.';
        } else {
            feedback.classList.add('show', 'incorrect');
            feedbackText.textContent = `✗ Incorrect. The correct answer is: ${currentCorrectAnswer}`;
        }
        
        // Enable next button
        document.getElementById('nextButton').disabled = false;
    }

    function getSignNumFromButton(button) {
        // Get sign number from data attribute
        return parseInt(button.dataset.signNum) || null;
    }

    function nextQuestion() {
        generateQuestion();
    }

    // Load on page load
    loadSignNames();
</script>

<script src="chatbot-widget.js"></script>

</body>
</html>
