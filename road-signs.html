<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Signs Quiz | DriveFlow</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-elevated: #1c2541;
        --bg-card: #2d3f5a;
        --bg-card-soft: #2d3f5a;
        --bg-card-smaller: #3a506b;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --border-strong: rgba(111, 255, 233, 0.7);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --accent-orange: #f97316;
        --accent-red: #ef4444;
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --text-soft: #6b7280;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
        --blur: 18px;
        --button-bg: #6fffe9;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        max-width: 1400px;
        margin: 96px auto 40px;
        padding: 0 20px 40px;
    }

    .page-header {
        position: relative;
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 40px;
        text-align: center;
    }

    .page-header h1 {
        margin: 0 0 12px;
        color: var(--text-main);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
    }

    .quiz-section {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 32px;
        max-width: 900px;
        margin: 0 auto;
    }


    .quiz-question {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 32px;
        text-align: center;
    }

    .question-sign-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 24px;
        width: 100%;
    }

    .question-sign-container.has-image {
        margin-bottom: 24px;
    }

    .question-sign-container.no-image {
        height: 0;
        overflow: hidden;
        margin-bottom: 0;
    }

    .question-sign-image {
        max-width: 100%;
        max-height: 400px;
        height: auto;
        border-radius: 12px;
        display: block;
        margin: 0 auto;
    }

    .options-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 24px;
    }

    .option-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
    }

    .option-row:hover:not(.correct):not(.incorrect) {
        border-color: rgba(129, 140, 248, 0.7);
        background: rgba(15, 23, 42, 0.95);
    }

    .option-row.selected {
        border-color: rgba(129, 140, 248, 0.7);
        background: rgba(99, 102, 241, 0.18);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    .option-row.correct {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }

    .option-row.incorrect {
        border-color: var(--accent-red);
        background: rgba(239, 68, 68, 0.18);
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
    }

    .option-text {
        flex: 1;
        color: var(--text-main);
        font-size: 16px;
        font-weight: 500;
    }

    /* Radio Button Styles */
    .radio-button {
        position: relative;
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        cursor: pointer;
    }

    .radio-button input[type="radio"] {
        width: 24px;
        height: 24px;
        cursor: pointer;
        accent-color: var(--primary);
    }

    .radio-button input[type="radio"]:disabled {
        cursor: not-allowed;
        opacity: 0.5;
    }


    .feedback {
        margin-top: 24px;
        padding: 20px;
        border-radius: 12px;
        display: none;
    }

    .feedback.show {
        display: block;
    }

    .feedback.correct {
        background: var(--accent-soft);
        border: 1px solid var(--accent);
        color: var(--accent);
    }

    .feedback.incorrect {
        background: rgba(239, 68, 68, 0.18);
        border: 1px solid var(--accent-red);
        color: var(--accent-red);
    }

    .feedback-text {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .action-button {
        padding: 12px 24px;
        border-radius: 999px;
        border: 1px solid var(--primary);
        background: var(--primary);
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .action-button:hover:not(:disabled) {
        background: var(--primary-blue-dark);
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .action-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .previous-button {
        padding: 12px 24px;
        border-radius: 999px;
        border: 1px solid var(--border-subtle);
        background: rgba(15, 23, 42, 0.9);
        color: var(--text-main);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .previous-button:hover:not(:disabled) {
        border-color: var(--primary);
        background: var(--primary-soft);
        transform: translateY(-1px);
    }

    .previous-button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .button-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.18s ease-out;
    }

    .btn-back:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
        border-color: rgba(129, 140, 248, 0.8);
    }

    @media (max-width: 1024px) {
        .content-layout {
            grid-template-columns: 1fr;
        }
        
        .pdf-container {
            height: 400px;
        }
    }
</style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1>Road Signs Quiz</h1>
        <p>Test your knowledge of Irish road signs</p>
    </div>

    <!-- Quiz Section -->
    <div class="quiz-section">
        <div class="quiz-question" id="questionText">
            What is the name of this sign?
        </div>

        <div class="question-sign-container">
            <img id="questionSignImage" class="question-sign-image" src="" alt="Road Sign">
        </div>
        
        <div class="options-container" id="optionsContainer">
            <!-- Options will be inserted here -->
        </div>

            <div class="feedback" id="feedback">
                <div class="feedback-text" id="feedbackText"></div>
            </div>

            <div class="button-container">
                <button class="previous-button" id="previousButton" onclick="previousQuestion()" disabled>Previous</button>
                <button class="action-button" id="actionButton" onclick="handleActionButton()" disabled>Submit</button>
            </div>
    </div>

    <div style="text-align: center;">
        <a href="drivingtest-theory.html" class="btn-back">← Back to Test Theory</a>
    </div>
</div>

<script>
    let allSignNames = [];
    let currentSignNumber = 1;
    let currentCorrectAnswer = '';
    let selectedAnswer = null;
    let questionAnswered = false;
    let questionHistory = []; // Track question history for previous button
    let currentQuestionIndex = 0; // Track position in history
    
    // Image existence cache to prevent flicker
    const imageExistsCache = new Map();

    // Load sign names from signs.txt
    // Signs are ordered 1-141, where sign number N corresponds to line N
    // Line 69 contains sign 70 (accounting for missing sign 69)
    async function loadSignNames() {
        try {
            const response = await fetch('signs.txt');
            if (!response.ok) {
                throw new Error('Failed to fetch signs.txt');
            }
            const text = await response.text();
            // Split by newlines - each line corresponds to a sign
            // Line 1 = Sign 1, Line 2 = Sign 2, ..., Line 68 = Sign 68, Line 69 = Sign 70, etc.
            const lines = text.split('\n');
            allSignNames = [];
            
            for (let i = 0; i < lines.length; i++) {
                const trimmed = lines[i].trim();
                // Remove line numbers if present (e.g., "1. No Entry" -> "No Entry")
                const cleaned = trimmed.replace(/^\d+\.\s*/, '');
                if (cleaned.length > 0) {
                    allSignNames.push(cleaned);
                }
            }
            
            // Generate first question
            generateQuestion();
        } catch (error) {
            console.error('Error loading signs:', error);
            document.getElementById('questionText').innerHTML = 'Error loading sign names. Please ensure signs.txt exists.';
        }
    }

    // Get image path for a sign number (handles missing sign 69)
    function getSignImagePath(signNumber) {
        const basePath = `All signs test day/${signNumber}`;
        return basePath;
    }

    // Check if image exists (with caching)
    function checkImageExists(src) {
        if (imageExistsCache.has(src)) {
            return Promise.resolve(imageExistsCache.get(src));
        }
        
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                imageExistsCache.set(src, true);
                resolve(true);
            };
            img.onerror = () => {
                imageExistsCache.set(src, false);
                resolve(false);
            };
            img.src = src;
        });
    }


    // Generate a random question
    function generateQuestion(isPrevious = false) {
        // Reset state
        selectedAnswer = null;
        questionAnswered = false;
        document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
        
        const actionButton = document.getElementById('actionButton');
        const previousButton = document.getElementById('previousButton');
        
        actionButton.disabled = true;
        actionButton.textContent = 'Submit';
        
        // Enable previous button if we have history
        previousButton.disabled = currentQuestionIndex === 0;
        
        // Get valid sign numbers (excluding 69)
        // The txt file has 140 lines, but we need to account for missing sign 69
        // So valid signs are 1-68 and 70-141 (141 total signs, but 69 is missing)
        const validSignNumbers = [];
        for (let i = 1; i <= 141; i++) {
            if (i !== 69) { // Skip sign 69
                validSignNumbers.push(i);
            }
        }
        
        // Pick a random sign number from valid ones (or use previous if going back)
        if (isPrevious && currentQuestionIndex > 0) {
            // Restore from history
            const previousQuestion = questionHistory[currentQuestionIndex - 1];
            currentSignNumber = previousQuestion.signNumber;
            selectedAnswer = previousQuestion.selectedAnswer;
            questionAnswered = previousQuestion.answered;
            currentQuestionIndex--;
        } else {
            // Generate new question
            const randomIndex = Math.floor(Math.random() * validSignNumbers.length);
            currentSignNumber = validSignNumbers[randomIndex];
            
            // Add to history if it's a new question
            if (!isPrevious) {
                questionHistory.push({
                    signNumber: currentSignNumber,
                    selectedAnswer: null,
                    answered: false
                });
                currentQuestionIndex = questionHistory.length - 1;
            }
        }
        
        // Get the correct answer - sign number maps directly to txt file line
        // The txt file already accounts for missing 69, so:
        // Sign 1-68 map to lines 1-68 (indices 0-67)
        // Sign 70+ map to lines 69+ (indices 68+)
        let correctIndex;
        if (currentSignNumber <= 68) {
            correctIndex = currentSignNumber - 1;
        } else {
            // Sign 70 = line 69 in txt (index 68), Sign 71 = line 70 (index 69), etc.
            correctIndex = currentSignNumber - 2;
        }
        currentCorrectAnswer = allSignNames[correctIndex];
        
        // Get the question sign image - only set src if image exists (prevents flicker)
        const imgElement = document.getElementById('questionSignImage');
        const containerElement = imgElement.parentElement;
        const imagePath = `All signs test day/${currentSignNumber}.png`;
        
        // Check if image exists before setting src
        checkImageExists(imagePath).then((exists) => {
            if (exists) {
                // Image exists - show it
                imgElement.src = imagePath;
                imgElement.style.display = 'block';
                if (containerElement) {
                    containerElement.classList.add('has-image');
                    containerElement.classList.remove('no-image');
                }
            } else {
                // Image doesn't exist - hide everything
                imgElement.style.display = 'none';
                if (containerElement) {
                    containerElement.classList.add('no-image');
                    containerElement.classList.remove('has-image');
                }
            }
        });
        
        // Get 3 wrong answer sign numbers (excluding the correct one and 69)
        const wrongSignNumbers = [];
        const usedNumbers = new Set([currentSignNumber]);
        
        while (wrongSignNumbers.length < 3) {
            const randomNum = validSignNumbers[Math.floor(Math.random() * validSignNumbers.length)];
            if (!usedNumbers.has(randomNum)) {
                wrongSignNumbers.push(randomNum);
                usedNumbers.add(randomNum);
            }
        }
        
        // Render options with images
        renderOptionsWithImages(currentSignNumber, wrongSignNumbers);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function renderOptionsWithImages(correctSignNum, wrongSignNums) {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        
        // Get sign names for all options
        let correctIndex = correctSignNum <= 68 ? correctSignNum - 1 : correctSignNum - 2;
        const correctName = allSignNames[correctIndex];
        
        const wrongNames = wrongSignNums.map(signNum => {
            let index = signNum <= 68 ? signNum - 1 : signNum - 2;
            return allSignNames[index];
        });
        
        // Create options array with sign names
        const options = [
            { name: correctName, isCorrect: true, signNum: correctSignNum },
            ...wrongNames.map((name, idx) => ({ name: name, isCorrect: false, signNum: wrongSignNums[idx] }))
        ];
        
        // Shuffle options
        shuffleArray(options);
        
        options.forEach((option, optIndex) => {
            const optionRow = document.createElement('div');
            optionRow.className = 'option-row';
            optionRow.dataset.signNum = option.signNum;
            optionRow.onclick = () => {
                if (!questionAnswered) {
                    const radioInput = optionRow.querySelector('input[type="radio"]');
                    if (radioInput) {
                        radioInput.checked = true;
                    }
                    selectAnswerBySignNum(option.signNum, optionRow);
                }
            };
            
            const optionText = document.createElement('span');
            optionText.className = 'option-text';
            optionText.textContent = option.name;
            
            const radioLabel = document.createElement('label');
            radioLabel.className = 'radio-button';
            radioLabel.onclick = (e) => {
                e.stopPropagation();
                if (!questionAnswered) {
                    const radioInput = radioLabel.querySelector('input[type="radio"]');
                    if (radioInput) {
                        radioInput.checked = true;
                    }
                    selectAnswerBySignNum(option.signNum, optionRow);
                }
            };
            
            const radioInput = document.createElement('input');
            radioInput.type = 'radio';
            radioInput.name = 'question';
            radioInput.value = optIndex;
            radioInput.disabled = questionAnswered;
            radioInput.onchange = () => {
                if (!questionAnswered) {
                    selectAnswerBySignNum(option.signNum, optionRow);
                }
            };
            
            radioLabel.appendChild(radioInput);
            optionRow.appendChild(optionText);
            optionRow.appendChild(radioLabel);
            
            container.appendChild(optionRow);
        });
    }

    function selectAnswerBySignNum(signNum, optionRowElement) {
        if (questionAnswered) return;
        
        // Just select the answer, don't submit yet
        selectedAnswer = signNum;
        
        // Check the selected radio button
        const selectedRadio = optionRowElement.querySelector('input[type="radio"]');
        if (selectedRadio) {
            selectedRadio.checked = true;
        }
        
        // Uncheck other radio buttons and update selected state
        document.querySelectorAll('.option-row').forEach(row => {
            if (row !== optionRowElement) {
                const radioInput = row.querySelector('input[type="radio"]');
                if (radioInput) {
                    radioInput.checked = false;
                }
                row.classList.remove('selected');
            } else {
                row.classList.add('selected');
            }
        });
        
        // Enable submit button
        document.getElementById('actionButton').disabled = false;
        
        // Update history
        if (questionHistory[currentQuestionIndex]) {
            questionHistory[currentQuestionIndex].selectedAnswer = signNum;
        }
    }

    function handleActionButton() {
        if (questionAnswered) {
            nextQuestion();
        } else {
            submitAnswer();
        }
    }

    function submitAnswer() {
        if (questionAnswered || selectedAnswer === null) return;
        
        questionAnswered = true;
        
        // Update history
        if (questionHistory[currentQuestionIndex]) {
            questionHistory[currentQuestionIndex].answered = true;
            questionHistory[currentQuestionIndex].selectedAnswer = selectedAnswer;
        }
        
        // Find the selected option row
        let selectedRow = null;
        let isCorrect = false;
        document.querySelectorAll('.option-row').forEach(row => {
            const rowSignNum = parseInt(row.dataset.signNum);
            if (rowSignNum === selectedAnswer) {
                selectedRow = row;
                isCorrect = (rowSignNum === currentSignNumber);
            }
        });
        
        // Disable all radio buttons and mark correct/incorrect
        document.querySelectorAll('.option-row').forEach(row => {
            const radioInput = row.querySelector('input[type="radio"]');
            if (radioInput) {
                radioInput.disabled = true;
            }
            
            // Find the correct answer row
            const rowSignNum = parseInt(row.dataset.signNum);
            if (rowSignNum === currentSignNumber) {
                row.classList.add('correct');
                row.classList.remove('selected');
            } else if (row === selectedRow && !isCorrect) {
                row.classList.add('incorrect');
                row.classList.remove('selected');
            } else {
                row.classList.remove('selected');
            }
        });
        
        // Show feedback
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedbackText');
        
        if (isCorrect) {
            feedback.classList.add('show', 'correct');
            feedbackText.textContent = '✓ Correct! Well done.';
        } else {
            feedback.classList.add('show', 'incorrect');
            feedbackText.textContent = `✗ Incorrect. The correct answer is: ${currentCorrectAnswer}`;
        }
        
        // Change button to "Next"
        const actionButton = document.getElementById('actionButton');
        actionButton.disabled = false;
        actionButton.textContent = 'Next';
    }

    function getSignNumFromButton(button) {
        // Get sign number from data attribute
        return parseInt(button.dataset.signNum) || null;
    }

    function nextQuestion() {
        generateQuestion(false);
    }

    function previousQuestion() {
        if (currentQuestionIndex > 0 && questionHistory.length > 0) {
            currentQuestionIndex--;
            const previousQuestion = questionHistory[currentQuestionIndex];
            
            // Restore question state
            currentSignNumber = previousQuestion.signNumber;
            selectedAnswer = previousQuestion.selectedAnswer;
            questionAnswered = previousQuestion.answered;
            
            // Get correct answer
            let correctIndex;
            if (currentSignNumber <= 68) {
                correctIndex = currentSignNumber - 1;
            } else {
                correctIndex = currentSignNumber - 2;
            }
            currentCorrectAnswer = allSignNames[correctIndex];
            
            // Re-render image
            const imgElement = document.getElementById('questionSignImage');
            const containerElement = imgElement.parentElement;
            const imagePath = `All signs test day/${currentSignNumber}.png`;
            
            checkImageExists(imagePath).then((exists) => {
                if (exists) {
                    imgElement.src = imagePath;
                    imgElement.style.display = 'block';
                    if (containerElement) {
                        containerElement.classList.add('has-image');
                        containerElement.classList.remove('no-image');
                    }
                } else {
                    imgElement.style.display = 'none';
                    if (containerElement) {
                        containerElement.classList.add('no-image');
                        containerElement.classList.remove('has-image');
                    }
                }
            });
            
            // Generate wrong options (they'll be different but that's okay)
            const validSignNumbers = [];
            for (let i = 1; i <= 141; i++) {
                if (i !== 69) validSignNumbers.push(i);
            }
            const wrongSignNumbers = [];
            const usedNumbers = new Set([currentSignNumber]);
            while (wrongSignNumbers.length < 3) {
                const randomNum = validSignNumbers[Math.floor(Math.random() * validSignNumbers.length)];
                if (!usedNumbers.has(randomNum)) {
                    wrongSignNumbers.push(randomNum);
                    usedNumbers.add(randomNum);
                }
            }
            
            renderOptionsWithImages(currentSignNumber, wrongSignNumbers);
            
            // Restore UI state after rendering
            setTimeout(() => {
                const actionButton = document.getElementById('actionButton');
                const previousButton = document.getElementById('previousButton');
                const feedback = document.getElementById('feedback');
                const feedbackText = document.getElementById('feedbackText');
                
                // Restore selection
                if (selectedAnswer !== null) {
                    const selectedRow = document.querySelector(`[data-sign-num="${selectedAnswer}"]`);
                    if (selectedRow) {
                        const radioInput = selectedRow.querySelector('input[type="radio"]');
                        if (radioInput) {
                            radioInput.checked = true;
                        }
                        selectedRow.classList.add('selected');
                    }
                }
                
                // Restore feedback if answered
                if (questionAnswered) {
                    const isCorrect = (selectedAnswer === currentSignNumber);
                    
                    if (isCorrect) {
                        feedback.classList.add('show', 'correct');
                        feedbackText.textContent = '✓ Correct! Well done.';
                    } else {
                        feedback.classList.add('show', 'incorrect');
                        feedbackText.textContent = `✗ Incorrect. The correct answer is: ${currentCorrectAnswer}`;
                    }
                    
                    // Mark correct/incorrect options
                    document.querySelectorAll('.option-row').forEach(row => {
                        const radioInput = row.querySelector('input[type="radio"]');
                        if (radioInput) {
                            radioInput.disabled = true;
                        }
                        
                        const rowSignNum = parseInt(row.dataset.signNum);
                        if (rowSignNum === currentSignNumber) {
                            row.classList.add('correct');
                        } else if (rowSignNum === selectedAnswer && !isCorrect) {
                            row.classList.add('incorrect');
                        }
                    });
                    
                    actionButton.disabled = false;
                    actionButton.textContent = 'Next';
                } else {
                    feedback.classList.remove('show', 'correct', 'incorrect');
                    actionButton.disabled = selectedAnswer === null;
                    actionButton.textContent = 'Submit';
                }
                
                previousButton.disabled = currentQuestionIndex === 0;
            }, 100);
        }
    }

    // Load on page load
    loadSignNames();
</script>

<script src="chatbot-widget.js"></script>

</body>
