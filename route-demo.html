<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Demo of DriveFlow's driving route assistant. See how our route navigation system works.">
<link rel="canonical" href="https://www.driveflow.ie/route-demo.html">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" href="favicon.png">
<title>Driving Route Assistant — DriveFlow | Route Demo</title>
<style>
  body { font-family: Arial; padding:20px; }
  #status { font-size:18px; margin-top:15px; }
</style>
</head>
<body>

<h2>Driving Test Route – Live Trigger Demo</h2>
<p>Location tracking is running. Move toward a marker to hear the instruction.</p>
<div id="status">Waiting for GPS...</div>

<script>
// ===== ROUTE TRIGGERS ===== 53.376527871857206, -6.581745871946112
//markers.forEach(m => m.triggered = false);

const markers = [
  {
    name: "Left onto main road",
    lat: 53.376527871857206,
    lng: -6.581745871946112,
    radius: 500,
    message: "Turn left onto the main road. Check mirrors and blind spot."
  },
  {
    name: "Right turn off main road",
    lat: 53.21574,
    lng: -6.67442,
    radius: 10000,
    message: "Turn right off the main road. Watch for oncoming traffic."
  }
];

// ===== DISTANCE FUNCTION (Haversine) =====
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371e3; // metres
  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;

  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c; // metres
}

// ===== TEXT TO SPEECH =====
function speak(text) {
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

// ===== LIVE GPS TRACKING =====
navigator.geolocation.watchPosition(pos => {
  const { latitude, longitude } = pos.coords;
  document.getElementById("status").innerText = 
      `GPS: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;

  markers.forEach(m => {
    let dist = getDistance(latitude, longitude, m.lat, m.lng);
    if (dist < m.radius && !m.triggered) {
      speak(m.message);
      m.triggered = true; // prevents repeating constantly
    }
  });
}, err => {
  document.getElementById("status").innerText = "GPS Error: " + err.message;
}, {
  enableHighAccuracy: true,
  maximumAge: 0,
  timeout: 5000
});
</script>
</body>
</html>
