    <script>
    (function () {
        var container = document.getElementById('shannonInfo');
        if (!container) return;

        function plain(s) {
            return (s || '').replace(/\*\*(.+?)\*\*/g, '$1');
        }

        function isLikelyHeading(line) {
            line = plain(line || '').trim();
            if (!line || line.length > 120) return false;
            if (line.endsWith(':')) return false;
            if (/^\d+\.\s/.test(line)) return true;
            if (/[.!?]$/.test(line)) return false;
            if (/^(If |You |This |There |They |Most |Are |Can |Is |What |No\.|Yes\.|Usually )/i.test(line)) return false;
            return true;
        }

        function isMajorSectionTitle(line) {
            return /^(About the Shannon Test Centre|How Test Routes Work at Shannon|Core Areas Examiners Frequently Use|Roundabout Behaviour at Shannon|Junction Types That Cause Fails|Speed Limit Traps|Common Mistakes at Shannon|Examiner Behaviour Patterns|High-Failure Locations|Test Day Flow at Shannon|Local Preparation Tips|About This Guide|FAQ)$/i.test(plain(line || '').trim());
        }

        function appendHeading(line) {
            var trimmed = plain(line || '').trim();
            var isH3 = trimmed === trimmed.toUpperCase() || trimmed.length > 42 || isMajorSectionTitle(trimmed);
            var el = document.createElement(isH3 ? 'h3' : 'h4');
            el.textContent = trimmed;
            container.appendChild(el);
        }

        function splitIntoBlocks(text) {
            var rawLines = text.split(/\r?\n/);
            var blocks = [];
            var buf = [];

            for (var i = 0; i < rawLines.length; i++) {
                var t = rawLines[i].trim();
                if (t === '' || t === '---') {
                    if (buf.length) {
                        blocks.push(buf);
                        buf = [];
                    }
                } else {
                    buf.push(rawLines[i].trim());
                }
            }

            if (buf.length) blocks.push(buf);
            return blocks;
        }

        function normalizeListItem(line) {
            return plain(line.replace(/^-+\s*/, '').trim());
        }

        function isBulletLine(line) {
            return /^-\s+/.test(line);
        }

        function looksLikeListLines(lines) {
            if (lines.length < 2) return false;
            for (var i = 0; i < lines.length; i++) {
                if (!isBulletLine(lines[i])) return false;
            }
            return true;
        }

        function mergeColonBlocks(blocks) {
            var merged = [];
            for (var i = 0; i < blocks.length; i++) {
                var cur = blocks[i].slice();
                while (cur.length === 1 && cur[0].endsWith(':') && i + 1 < blocks.length) {
                    var nextFirst = blocks[i + 1][0];
                    if (isMajorSectionTitle(nextFirst)) break;
                    i++;
                    cur = cur.concat(blocks[i]);
                }
                merged.push(cur);
            }
            return merged;
        }

        function appendList(lines) {
            var ul = document.createElement('ul');
            for (var i = 0; i < lines.length; i++) {
                var li = document.createElement('li');
                li.textContent = normalizeListItem(lines[i]);
                ul.appendChild(li);
            }
            container.appendChild(ul);
        }

        function renderBlock(lines, isFirstBlock) {
            if (!lines.length) return;

            if (looksLikeListLines(lines)) {
                appendList(lines);
                return;
            }

            if (lines.length === 1) {
                var line = lines[0];
                var pl = plain(line);
                var boldWrap = line.match(/^\*\*(.+)\*\*$/);
                if (boldWrap) {
                    var h4faq = document.createElement('h4');
                    h4faq.textContent = plain(boldWrap[1]);
                    container.appendChild(h4faq);
                    return;
                }
                if (line.indexOf('## ') === 0) {
                    var h3 = document.createElement('h3');
                    h3.textContent = plain(line.slice(3));
                    container.appendChild(h3);
                    return;
                }
                if (line.indexOf('# ') === 0) {
                    var h2 = document.createElement('h2');
                    h2.textContent = plain(line.slice(2));
                    container.appendChild(h2);
                    return;
                }
                if (isFirstBlock) {
                    var h2fb = document.createElement('h2');
                    h2fb.textContent = pl;
                    container.appendChild(h2fb);
                } else if (/^\d+\.\s/.test(line) || line.charAt(line.length - 1) === '?') {
                    var h4 = document.createElement('h4');
                    h4.textContent = pl;
                    container.appendChild(h4);
                } else if (isLikelyHeading(line)) {
                    appendHeading(line);
                } else {
                    var p = document.createElement('p');
                    p.textContent = pl;
                    container.appendChild(p);
                }
                return;
            }

            if (lines[0].indexOf('## ') === 0) {
                var h3b = document.createElement('h3');
                h3b.textContent = plain(lines[0].slice(3));
                container.appendChild(h3b);
                renderBlock(lines.slice(1), false);
                return;
            }

            if (lines[0].indexOf('# ') === 0) {
                var h2b = document.createElement('h2');
                h2b.textContent = plain(lines[0].slice(2));
                container.appendChild(h2b);
                renderBlock(lines.slice(1), false);
                return;
            }

            if (isLikelyHeading(lines[0]) || isMajorSectionTitle(lines[0])) {
                appendHeading(lines[0]);
                renderBlock(lines.slice(1), false);
                return;
            }

            if (lines[0].endsWith(':')) {
                var intro = document.createElement('p');
                intro.textContent = plain(lines[0]);
                container.appendChild(intro);
                renderBlock(lines.slice(1), false);
                return;
            }

            var pFallback = document.createElement('p');
            pFallback.textContent = plain(lines.join(' '));
            container.appendChild(pFallback);
        }

        fetch('txt%20files/shannon.txt')
            .then(function (r) {
                return r.ok ? r.text() : Promise.reject(new Error('Failed to fetch shannon.txt'));
            })
            .then(function (text) {
                var trimmed = text.trim();
                if (!trimmed) return;
                container.innerHTML = '';
                var blocks = mergeColonBlocks(splitIntoBlocks(trimmed));
                for (var i = 0; i < blocks.length; i++) {
                    renderBlock(blocks[i], i === 0);
                }
            })
            .catch(function (err) {
                console.error('Failed to load Shannon text file:', err);
            });
    })();
    </script>
