<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-elevated: #1c2541;
        --bg-card: #2d3f5a;
        --bg-card-soft: #2d3f5a;
        --bg-card-smaller: #3a506b;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --border-strong: rgba(111, 255, 233, 0.7);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --accent-orange: #f97316;
        --accent-red: #ef4444;
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --text-soft: #6b7280;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
        --blur: 18px;
        --button-bg: #6fffe9;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        max-width: 1200px;
        margin: 96px auto 40px;
        padding: 0 20px 40px;
    }

    .page-header {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 40px;
        text-align: center;
    }

    .page-header h1 {
        margin: 0 0 12px;
        color: var(--text-main);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
    }

    .results-card {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 24px;
    }

    .results-card h2 {
        margin: 0 0 24px;
        font-size: 24px;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.01em;
    }

    #chartContainer {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }

    .no-scores {
        text-align: center;
        color: var(--text-muted);
        padding: 60px 40px;
        font-size: 16px;
    }

    .no-scores p {
        margin: 0 0 12px;
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid var(--button-bg);
        background: var(--button-bg);
        color: var(--bg-main);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.18s ease-out;
    }

    .btn-back:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(111, 255, 233, 0.4);
        border-color: var(--button-bg);
        background: var(--primary);
        color: var(--text-main);
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
    }

    @media (max-width: 768px) {
        .chart-container {
            flex-direction: column;
        }

        .chart-y-axis {
            flex-direction: row;
            padding-right: 0;
            padding-bottom: 15px;
            justify-content: space-between;
        }

        .bars {
            height: 400px;
        }

        .chart-bar {
            width: 40px;
        }
    }
</style>

<body>

<div class="container">
    <div class="page-header">
        <h1>Mock Test Results</h1>
        <p>Track your progress over time</p>
    </div>

    <div class="results-card">
        <h2>Your Test Scores</h2>
        <div id="chartContainer">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div style="text-align: center;">
        <a href="dashboard.html" class="btn-back">← Back to Dashboard</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const API_URL = location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "http://localhost:8080"
        : "https://driving-test-backend-production.up.railway.app";

    const ctx = document.getElementById('myChart');

    let chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: [],
            datasets: [{
                label: 'Scores',
                data: [],
                backgroundColor: []
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    max: 40,
                    ticks: {
                        color: 'var(--text-muted)',
                        font: {
                            family: 'Inter'
                        }
                    },
                    grid: {
                        color: 'var(--border-subtle)'
                    }
                },
                x: {
                    ticks: {
                        color: 'var(--text-muted)',
                        font: {
                            family: 'Inter'
                        }
                    },
                    grid: {
                        color: 'var(--border-subtle)'
                    }
                }
            }
        }
    });

    async function getTestScores() {
        const token = localStorage.getItem('auth_token');
        
        // Try to fetch from backend if logged in
        if (token) {
            try {
                const response = await fetch(`${API_URL}/mock-tests/results?limit=7`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    // Convert backend format to frontend format
                    const scores = data.results.map(result => ({
                        correct: result.correct_count,
                        total: result.total_questions,
                        percentage: result.percentage,
                        timestamp: new Date(result.created_at).getTime(),
                        date: new Date(result.created_at).toLocaleDateString()
                    }));
                    return scores;
                }
            } catch (err) {
                console.error('Error fetching from backend:', err);
                // Fall through to localStorage
            }
        }

        // Fallback to localStorage
        let storageKey;
        
        if (token) {
            try {
                const tokenHash = token.substring(0, 10);
                storageKey = `mock_test_scores_${tokenHash}`;
            } catch (e) {
                storageKey = 'mock_test_scores_logged_in';
            }
        } else {
            storageKey = 'mock_test_scores_session';
        }

        return JSON.parse(localStorage.getItem(storageKey) || '[]');
    }

    function getScoreColor(score) {
        if (score >= 35) return '#6fffe9'; // Pass - accent (teal/cyan)
        if (score >= 30) return '#f97316'; // Almost - orange
        return '#ef4444'; // Fail - red
    }

    // Load and display chart on page load
    async function loadChart() {
        const chartContainer = document.getElementById('chartContainer');
        
        try {
            const scores = await getTestScores();
            
            if (scores.length === 0) {
                chartContainer.innerHTML = `
                    <div class="no-scores">
                        <p>No test scores yet</p>
                        <p style="font-size: 14px; margin-top: 16px;">Complete a mock test to see your results here!</p>
                        <a href="mock-test.html" class="btn-back" style="margin-top: 24px; display: inline-block;">Take a Mock Test</a>
                    </div>
                `;
                return;
            }

            // Limit to 7 most recent scores
            const recentScores = scores.slice(0, 7);
            const labels = recentScores.map((score, index) => `Score ${index + 1}`);
            const data = recentScores.map(score => score.correct);
            const colors = recentScores.map(score => getScoreColor(score.correct));

            chart.data.labels = labels;
            chart.data.datasets[0].data = data;
            chart.data.datasets[0].backgroundColor = colors;
            chart.update();
        } catch (err) {
            console.error('Error loading test results:', err);
            chartContainer.innerHTML = '<div class="no-scores">Error loading results. Please try again later.</div>';
        }
    }

    // Check if user is logged in
    const token = localStorage.getItem('auth_token');
    if (!token) {
        window.location.href = 'login.html';
    } else {
        loadChart();
    }
</script>

<script src="chatbot-widget.js"></script>

</body>
</html>
