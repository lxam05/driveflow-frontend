<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Test | DriveFlow</title>

<style>
/* ------------ THEME + GLOBALS -------------- */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --bg-main:#0b132b; --bg-card:#2d3f5a; --bg-elev:#1c2541;
    --primary:#5bc0be; --accent:#6fffe9; --red:#ef4444; --orange:#f97316;
    --text:#e5e7eb; --text-light:#9ca3af; --border:rgba(91,192,190,.22);
    --shadow:0 18px 60px rgba(0,0,0,.6); --radius:22px;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg-main);color:var(--text);
  font-family:'Inter',sans-serif;min-height:100vh;
}

/* ------------ RESPONSIVE PAGE LAYOUT -------------- */
.page{
    display:flex;
    gap:24px;
    width:100%;
    max-width:1420px;
    margin:auto;
    padding:20px;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:280px;flex-shrink:0;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
  box-shadow:var(--shadow);
  position:sticky;top:16px;
}
.sidebar h2{margin:0 0 18px;font-size:20px;font-weight:700;}
.timer-box{margin-top:12px;}
.timer-label{font-size:11px;color:var(--text-light);letter-spacing:.1em;}
.timer{
  margin-top:6px;
  padding:14px;border-radius:12px;
  border:1px solid var(--border);
  font-size:22px;font-weight:700;text-align:center;
  background:rgba(15,23,42,.9);
}
.timer.warning{color:var(--orange);border-color:var(--orange);}
.timer.danger{color:var(--red);border-color:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.5;}}

/* ===== MAIN ===== */
.main{flex:1;display:flex;flex-direction:column;width:100%;}
.progress{width:100%;height:8px;border-radius:4px;
    margin-bottom:30px;border:1px solid var(--border);
    background:rgba(15,23,42,.9);overflow:hidden;}
.progress-fill{
  height:100%;background:linear-gradient(120deg,#2563eb,#7c3aed);
  transition:.3s;width:0%;
}

/* ===== QUESTION CARD — ALWAYS FULL WIDTH ===== */
.question-wrapper{width:100%;}
.question-card{
  width:100%;
  background:var(--bg-card);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:var(--radius);
  padding:32px;
  display:flex;
  flex-direction:column;
  gap:22px;
}

/* Question text */
.q-num{font-size:13px;color:var(--text-light);letter-spacing:.6px;}
.q-text{font-size:21px;font-weight:700;line-height:1.45;}

/* Options */
.options{display:flex;flex-direction:column;gap:14px;width:100%;}
.option{
  background:rgba(15,23,42,.9);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  display:flex;justify-content:space-between;align-items:center;
  transition:.2s;cursor:pointer;
}
.option:hover{border-color:rgba(129,140,248,.7);}
.option.selected{background:rgba(99,102,241,.18);border-color:rgba(129,140,248,.7);}
.option.correct{background:rgba(111,255,233,.18);border-color:var(--accent);}
.option.incorrect{background:rgba(239,68,68,.18);border-color:var(--red);}
.option span{font-size:16px;flex:1;margin-right:20px;}

/* Toggle */
.toggle{
 position:relative;width:50px;height:30px;flex-shrink:0;
}
.toggle input{opacity:0;width:0;height:0;position:absolute;}
.toggle::before,.toggle::after{content:'';position:absolute;}
.toggle::before{
 top:0;left:0;width:100%;height:100%;background:#475569;border-radius:30px;transition:.25s;
}
.toggle::after{
 top:2.5px;left:3px;width:25px;height:25px;border-radius:50%;
 background:white;transition:.25s;
}
.toggle input:checked + .toggle::before{background:var(--primary);}
.toggle input:checked + .toggle::after{transform:translateX(19px);}

/* Buttons */
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:12px;}
.btn{
 padding:12px 22px;border-radius:999px;font-size:15px;font-weight:700;
 cursor:pointer;border:1px solid rgba(148,163,184,.4);background:rgba(15,23,42,.92);color:var(--text);
 transition:.2s;text-align:center;flex:1;
}
.btn:hover{border-color:rgba(129,140,248,.9);}
.btn.blue{background:linear-gradient(120deg,#2563eb,#7c3aed);border-color:#6366f1;color:white;}
.btn.blue:hover{box-shadow:0 0 10px rgba(99,102,241,.7);}

/* Feedback */
.feedback{
 padding:18px;border-radius:16px;margin-top:8px;font-size:15px;
}
.feedback.correct{background:rgba(111,255,233,.12);border-left:5px solid var(--accent);}
.feedback.incorrect{background:rgba(239,68,68,.12);border-left:5px solid var(--red);}

/* ===== MOBILE FIX — THE PART YOU NEEDED ===== */
@media(max-width:900px){
  .page{flex-direction:column;}
  .sidebar{width:100%;position:relative;}
  .question-card{width:100%;border-radius:14px;padding:22px;}
}

/* Completion page UI */
.center{text-align:center;margin-top:30px;}
.big-score{font-size:32px;font-weight:800;margin-bottom:8px;}
.result-pass{color:var(--accent);font-size:20px;font-weight:700;}
.result-fail{color:var(--red);font-size:20px;font-weight:700;}

/* Chart */
.no-scores{text-align:center;color:var(--text-light);margin-top:20px;}
</style>
</head>
<body>


<div class="page">

<!-- ========== SIDEBAR ========== -->
<div class="sidebar">
    <h2>Mock Theory Test</h2>
    <div class="timer-box">
        <div class="timer-label">TIME REMAINING</div>
        <div id="timer" class="timer">45:00</div>
    </div>
    <button class="btn" onclick="backHome()">← Back to Home</button>
</div>


<!-- ========== MAIN TEST AREA ========== -->
<div class="main">
    <div class="progress"><div id="progressFill" class="progress-fill"></div></div>
    <div id="questions"></div>
</div>

</div>


<script>
/* =============================
   JAVASCRIPT — same logic as yours
   but rebuilt clean & responsive
============================= */

const API_URL="https://driving-test-backend-production.up.railway.app";
const TOTAL=45*60;
let timer=TOTAL,questions=[],userAns={},sel={},i=0,Run;
load();

async function load(){
 const r=await fetch("questions_1_805.json");
 const d=await r.json();
 let all=d.map(q=>{
   let c=q.options.findIndex(o=>o===q.correct_answer);
   if(c<0)return null;
   return{ id:q.id,q:q.question,op:q.options,ca:c,x:q.explanation||'' }
 }).filter(Boolean);

 shuffle(all);
 questions=all.slice(0,40);
 start(); render();
}

function start(){
 Run=setInterval(()=>{
   timer--; setTimer();
   if(timer<=0){clearInterval(Run);finish();}
 },1000);
}
function setTimer(){
 let m=Math.floor(timer/60),s=timer%60;
 const t=document.getElementById("timer");
 t.textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
 if(timer<=300)t.classList.add("danger");
 else if(timer<=600)t.classList.add("warning");
}
function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}}

/* ---------- RENDER QUESTION ----------- */
function render(){
 const q=questions[i],done=userAns[i]!=null,selAns=sel[i];
 let html=`
 <div class="question-wrapper">
 <div class="question-card">

    <div class="q-num">Question ${i+1} of 40</div>
    <div class="q-text">${q.q}</div>

    <div class="options">
        ${q.op.map((o,n)=>{
           let cl="option";
           if(done){
             if(n===q.ca)cl+=" correct";
             else if(n===userAns[i])cl+=" incorrect";
           }else if(selAns===n)cl+=" selected";
           return`
           <div class="${cl}" onclick="choose(${n})">
               <span>${o}</span>
               <label class="toggle">
                 <input type="radio" ${selAns===n?"checked":""} ${done?"disabled":""}>
               </label>
           </div>`}).join('')}
    </div>

    ${done?`<div class="feedback ${userAns[i]===q.ca?"correct":"incorrect"}">
       <b>Correct Answer:</b><br>${q.op[q.ca]}
       ${q.x?`<br><br>${q.x}`:""}
    </div>`:""}

    <div class="controls">
        ${i>0?`<button class="btn" onclick="prev()">← Previous</button>`:""}
        ${!done?`<button class="btn blue" onclick="submit()">Submit Answer</button>`:
          `<button class="btn blue" onclick="next()">${i<39?"Continue →":"Finish Test"}</button>`}
    </div>

 </div></div>`;

 document.getElementById("questions").innerHTML=html;
 let p=Object.keys(userAns).length/40*100;
 document.getElementById("progressFill").style.width=p+"%";
}

/* Controls */
function choose(n){if(userAns[i]!=null)return;sel[i]=n;render();}
function submit(){if(sel[i]==null)return;userAns[i]=sel[i];render();}
function prev(){i--;render();}
function next(){i++;if(i>=40)finish();else render();}

function finish(){
 clearInterval(Run);
 document.querySelector(".sidebar").remove();
 document.querySelector(".page").style.maxWidth="100%";

 let score=Object.keys(userAns).filter(n=>userAns[n]==questions[n].ca).length;
 let pass=score>=35;
 document.getElementById("questions").innerHTML=`
   <div class='question-card center'>
     <div class='big-score'>${score}/40</div>
     <div class='${pass?"result-pass":"result-fail"}'>
         ${pass?"✓ PASS":"✗ FAIL"}
     </div>
     <br>
     <button class="btn blue" style="max-width:250px" onclick="location.reload()">Take Again</button>
     <br><br>
     <button class="btn" onclick="backHome()" style="max-width:250px">← Home</button>
   </div>`;
 document.getElementById("progressFill").style.width="100%";
}

/* Back Navigation */
function backHome(){location.href="main.html";}
</script>

</body>
</html>
