<!DOCTYPE html>
<html lang="en">
<head>
<script src="/cookie-consent.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Login to your DriveFlow account to access mock tests, practice questions, and driving test routes.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.driveflow.ie/login.html">
<link rel="icon" href="https://www.driveflow.ie/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="https://www.driveflow.ie/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://www.driveflow.ie/favicon.png">
<link rel="apple-touch-icon" href="https://www.driveflow.ie/favicon.png">
<title>Login — DriveFlow | Access Your Account</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #fafafa;
        --bg-main-pattern: radial-gradient(circle, rgba(0, 0, 0, 0.08) 1px, transparent 1px);
        --bg-elevated: #f9f9f9;
        --bg-card: #f9f9f9;
        --bg-card-soft: #fafafa;
        --bg-card-smaller: #f5f5f5;
        --border-subtle: #eee;
        --border-strong: #ddd;
        --primary: #1a1a1a;
        --primary-soft: rgba(26, 26, 26, 0.08);
        --accent: #e6b800;
        --accent-soft: rgba(230, 184, 0, 0.15);
        --accent-orange: #f97316;
        --accent-red: #ef4444;
        --text-main: #1a1a1a;
        --text-muted: #666;
        --text-soft: #555;
        --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
        --radius-lg: 22px;
        --radius-xl: 26px;
        --blur: 18px;
        --button-bg: #1a1a1a;
        --primary-blue: #1a1a1a;
        --primary-blue-dark: #333;
        --accent-purple: #e6b800;
        --text-dark: #1a1a1a;
        --text-light: #666;
        --bg-glass: rgba(255, 255, 255, 0.95);
        --shadow-lg: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        background-image: var(--bg-main-pattern);
        background-size: 20px 20px;
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    /* Header */
    header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: var(--bg-main);
        background-image: var(--bg-main-pattern);
        background-size: 20px 20px;
        border-bottom: 1px solid var(--border-subtle);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        padding: 14px 20px;
    }

    .nav-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .brand-logo {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: radial-gradient(circle at 20% 20%, #4f46e5, #22c55e);
        box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.4),
                    0 14px 35px rgba(15, 23, 42, 0.85);
    }

    .brand-text h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--text-main);
    }

    /* Auth Container */
    .auth-container {
        width: 100%;
        max-width: 440px;
        margin-top: 60px;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        margin-bottom: 20px;
        padding: 7px 13px;
        border-radius: 999px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-card);
        transition: all 0.18s ease-out;
        font-size: 13px;
    }

    .back-link:hover {
        color: var(--text-main);
        border-color: var(--primary);
        transform: translateY(-1px);
    }

    .auth-card {
        position: relative;
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .auth-card h2 {
        font-size: 28px;
        font-weight: 800;
        color: var(--text-main);
        margin: 0 0 8px;
        letter-spacing: -0.02em;
    }

    .auth-card p {
        color: var(--text-muted);
        margin: 0 0 32px;
        font-size: 14px;
    }

    /* Form Styles */
    .form-group {
        margin-bottom: 24px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
    }

    .form-group input {
        width: 100%;
        padding: 14px 16px;
        font-size: 15px;
        border: 1px solid var(--border-subtle);
        border-radius: 18px;
        background: #fff;
        color: var(--text-main);
        transition: all 0.18s ease-out;
        font-family: 'Inter', sans-serif;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
        background: #fff;
    }

    .form-group input::placeholder {
        color: var(--text-soft);
    }

    .error-message {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.5);
        color: #dc2626;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 13px;
        margin-bottom: 24px;
        display: none;
    }

    .error-message.show {
        display: block;
        animation: slideIn 0.3s ease;
    }

    .success-message {
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.5);
        color: #1a1a1a;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 13px;
        margin-bottom: 24px;
        display: none;
    }

    .success-message.show {
        display: block;
        animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .btn-submit {
        width: 100%;
        padding: 14px;
        font-size: 15px;
        font-weight: 700;
        border: 1px solid var(--primary);
        border-radius: 999px;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        transition: all 0.18s ease-out;
        margin-top: 8px;
    }

    .btn-submit:hover:not(:disabled) {
        transform: translateY(-1px);
        background: #333;
    }

    .btn-submit:active:not(:disabled) {
        transform: translateY(0);
    }

    .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .auth-links {
        text-align: center;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border-subtle);
    }

    .auth-links p {
        color: var(--text-muted);
        margin: 0 0 12px;
        font-size: 13px;
    }

    .auth-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
    }

    .auth-links a:hover {
        color: #333;
    }

    @media (max-width: 480px) {
        .auth-card {
            padding: 32px 24px;
        }

        .auth-card h2 {
            font-size: 24px;
        }
    }
</style>
</head>
<body>

<header>
    <div class="nav-inner">
        <div class="brand">
            <div class="brand-logo"></div>
            <div class="brand-text">
                <h1>DriveFlow</h1>
            </div>
        </div>
    </div>
</header>

<div class="auth-container">
    <a href="index.html" class="back-link">← Back to Home</a>
    
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Sign in to continue your learning journey</p>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your.email@example.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Sign In
            </button>
        </form>

        <div class="auth-links">
            <p><a href="forgot-password.html">Forgot your password?</a></p>
            <p>Don't have an account? <a href="signup.html" id="signupLink">Sign up</a></p>
        </div>
    </div>
</div>

<script>
    const API_URL =
    location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "http://localhost:8080"   // ← backend when running locally
        : "https://driving-test-backend-production.up.railway.app"; // ← built site

    const urlParams = new URLSearchParams(window.location.search);
    const redirectToPayment = urlParams.get('redirect') === 'payment';
    const centreParam = urlParams.get('centre');
    const paymentUrl = redirectToPayment
        ? (centreParam ? 'payment.html?centre=' + encodeURIComponent(centreParam) : 'payment.html')
        : 'index.html';

    // if logged in already, redirect based on intent
    if (localStorage.getItem('auth_token')) {
        window.location.href = paymentUrl;
    }

    const signupLink = document.getElementById('signupLink');
    if (signupLink && redirectToPayment) {
        signupLink.href = centreParam ? 'signup.html?redirect=payment&centre=' + encodeURIComponent(centreParam) : 'signup.html?redirect=payment';
    }

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add('show');
        successMessage.classList.remove('show');
    }

    function showSuccess(message) {
        successMessage.textContent = message;
        successMessage.classList.add('show');
        errorMessage.classList.remove('show');
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
            const response = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                showError(data.error || 'Login failed.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
                return;
            }

            // STORE THE TOKEN CORRECTLY
            localStorage.setItem('auth_token', data.token);

            showSuccess('Login successful');

            setTimeout(() => {
                window.location.href = paymentUrl;
            }, 800);

        } catch (err) {
            showError('Cannot reach server.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    });
</script>

</body>
</html>
