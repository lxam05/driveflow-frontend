<body>
    <div class="container">
        <div class="page-header">
            <h1>Portlaoise Driving Test Routes</h1>
            <p>Access detailed route information for the Portlaoise test centre</p>
            <p style="margin-top: 16px; color: var(--accent); font-weight: 600; font-size: 16px;">Used by thousands of learners around Ireland to pass their test first try</p>
            <a href="#routes" style="display: inline-block; margin-top: 20px; padding: 12px 24px; background: var(--primary); color: var(--bg-main); border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.2s ease;">View Routes →</a>
        </div>

        <div class="info-section" id="portlaoiseInfo">
            <p>Loading...</p>
        </div>
        
        <div id="routes" class="routes-section" data-route="portlaoise" style="scroll-margin-top: 120px;"></div>
        <div id="sharedPurchase"></div>
        <div id="sharedFooter"></div>
    </div>

    <script>
    (function () {
        var container = document.getElementById('portlaoiseInfo');
        if (!container) return;
        fetch('txt%20files/portl.txt')
            .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error('Failed to fetch')); })
            .then(function (text) {
                var trimmed = text.trim();
                if (!trimmed) return;
                container.innerHTML = '';
                var blocks = trimmed.split(/\n\s*\n/);
                blocks.forEach(function (block, index) {
                    var cleaned = block.replace(/\s+/g, ' ').trim();
                    if (!cleaned) return;
                    var el = document.createElement(index === 0 ? 'h2' : 'p');
                    el.textContent = cleaned;
                    container.appendChild(el);
                });
            })
            .catch(function () { container.innerHTML = '<p>Content loading...</p>'; });
    })();
    </script>
