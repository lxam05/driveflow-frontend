<!DOCTYPE html>
<html lang="en">
<head>
<script src="/cookie-consent.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.driveflow.ie/forgot-password.html">
<link rel="icon" href="https://www.driveflow.ie/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="https://www.driveflow.ie/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://www.driveflow.ie/favicon.png">
<link rel="apple-touch-icon" href="https://www.driveflow.ie/favicon.png">
<title>Reset Password — DriveFlow</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #fafafa;
        --bg-main-pattern: radial-gradient(circle, rgba(0, 0, 0, 0.08) 1px, transparent 1px);
        --bg-elevated: #f9f9f9;
        --bg-card: #f9f9f9;
        --bg-card-soft: #fafafa;
        --bg-card-smaller: #f5f5f5;
        --border-subtle: #eee;
        --border-strong: #ddd;
        --primary: #1a1a1a;
        --primary-soft: rgba(26, 26, 26, 0.08);
        --accent: #e6b800;
        --accent-soft: rgba(230, 184, 0, 0.15);
        --accent-orange: #f97316;
        --accent-red: #ef4444;
        --text-main: #1a1a1a;
        --text-muted: #666;
        --text-soft: #555;
        --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
        --radius-lg: 22px;
        --radius-xl: 26px;
        --blur: 18px;
        --button-bg: #1a1a1a;
        --primary-blue: #1a1a1a;
        --primary-blue-dark: #333;
        --accent-purple: #e6b800;
        --text-dark: #1a1a1a;
        --text-light: #666;
        --bg-glass: rgba(255, 255, 255, 0.95);
        --shadow-lg: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        background-image: var(--bg-main-pattern);
        background-size: 20px 20px;
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: var(--bg-main);
        background-image: var(--bg-main-pattern);
        background-size: 20px 20px;
        border-bottom: 1px solid var(--border-subtle);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        padding: 14px 20px;
    }

    .nav-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .brand-logo {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: radial-gradient(circle at 20% 20%, #4f46e5, #22c55e);
        box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.4),
                    0 14px 35px rgba(15, 23, 42, 0.85);
    }

    .brand-text h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--text-main);
    }

    .auth-container {
        width: 100%;
        max-width: 440px;
        margin-top: 60px;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        margin-bottom: 20px;
        padding: 7px 13px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: radial-gradient(circle at top left, rgba(30, 64, 175, 0.18), transparent 60%);
        transition: all 0.18s ease-out;
        font-size: 13px;
    }

    .auth-card {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
    }

    .auth-card h2 {
        font-size: 26px;
        font-weight: 800;
        margin: 0 0 8px;
    }

    .auth-card p {
        color: var(--text-muted);
        margin: 0 0 24px;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
    }

    .form-group input {
        width: 100%;
        padding: 14px 16px;
        font-size: 15px;
        border: 1px solid var(--border-subtle);
        border-radius: 18px;
        background: #fff;
        color: var(--text-main);
        transition: all 0.18s ease-out;
        font-family: 'Inter', sans-serif;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
        background: #fff;
    }

    .form-group input::placeholder {
        color: var(--text-soft);
    }

    button {
        width: 100%;
        padding: 14px 16px;
        border-radius: 18px;
        border: none;
        background: var(--accent);
        color: #0b132b;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
    }

    .message {
        display: none;
        margin-bottom: 16px;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 13px;
    }

    .message.show {
        display: block;
    }

    .message.error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.5);
        color: #fecaca;
    }

    .message.success {
        background: rgba(34, 197, 94, 0.08);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: var(--text-main);
    }
</style>
</head>
<body>
<header>
    <div class="nav-inner">
        <div class="brand">
            <div class="brand-logo"></div>
            <div class="brand-text">
                <h1>DriveFlow</h1>
            </div>
        </div>
    </div>
</header>

<div class="auth-container">
    <a href="login.html" class="back-link">← Back to Login</a>

    <div class="auth-card">
        <h2>Reset your password</h2>
        <p>Enter your email and we will send you a reset link.</p>

        <div class="message error" id="errorMessage"></div>
        <div class="message success" id="successMessage"></div>

        <form id="resetRequestForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <button type="submit" id="submitBtn">Send reset link</button>
        </form>
    </div>
</div>

<script>
    const API_URL =
    location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "http://localhost:8080"
        : "https://driving-test-backend-production.up.railway.app";

    const resetRequestForm = document.getElementById('resetRequestForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add('show');
        successMessage.classList.remove('show');
    }

    function showSuccess(message) {
        successMessage.textContent = message;
        successMessage.classList.add('show');
        errorMessage.classList.remove('show');
    }

    resetRequestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');

        const email = document.getElementById('email').value.trim();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        try {
            const response = await fetch(`${API_URL}/auth/request-password-reset`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await response.json();
            if (!response.ok) {
                showError(data.error || 'Failed to send reset email.');
            } else {
                showSuccess(data.message || 'A reset link has been sent to your email. Please check yoour spam.');
            }
        } catch (err) {
            showError('Cannot reach server.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send reset link';
        }
    });
</script>

</body>
</html>
