<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Bar Chart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chart-container">

    <!-- Y axis values -->
    <div class="y-axis">
        <div>20</div>
        <div>18</div>
        <div>16</div>
        <div>14</div>
        <div>12</div>
        <div>10</div>
        <div>8</div>
        <div>6</div>
        <div>4</div>
        <div>2</div>
        <div>0</div>
    </div>

    <!-- Grid + bars -->
    <div class="chart-grid">
        <div class="bars">

            <div class="bar-item">
                <div class="tooltip">text field</div>
                <div class="bar" style="height: 140px; background:#c0d341"></div>
                <div class="label">Lorem ipsum</div>
            </div>

            <div class="bar-item">
                <div class="tooltip">text field</div>
                <div class="bar" style="height: 110px; background:#6ac0d4"></div>
                <div class="label">Pellentesque</div>
            </div>

            <div class="bar-item">
                <div class="tooltip">text field</div>
                <div class="bar" style="height: 180px; background:#21607c"></div>
                <div class="label">Nullam tortor</div>
            </div>

            <div class="bar-item">
                <div class="tooltip">text field</div>
                <div class="bar" style="height: 160px; background:#d54463"></div>
                <div class="label">Lorem ipsum</div>
            </div>

            <div class="bar-item">
                <div class="tooltip">text field</div>
                <div class="bar" style="height: 210px; background:#f7c040"></div>
                <div class="label">Pellentesque</div>
            </div>

            <div class="bar-item">
                <div class="tooltip">text field</div>
                <div class="bar" style="height: 120px; background:#257c85"></div>
                <div class="label">Nullam tortor</div>
            </div>

        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
<style>body {
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

.chart-container {
    display: flex;
    width: 900px;
    margin: 60px auto;
}

.y-axis {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-right: 15px;
    text-align: right;
    font-weight: bold;
    color: #777;
}

.chart-grid {
    flex: 1;
    border-left: 1px solid #ccc;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 45px,
        #e3e3e3 45px,
        #e3e3e3 46px
    );
    position: relative;
}

.bars {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    height: 500px;
    padding-top: 20px;
}

.bar-item {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.bar {
    width: 60px;
    border-radius: 4px;
    box-shadow: 0px 5px 5px rgba(0,0,0,0.2);
}

.label {
    margin-top: 10px;
    font-size: 14px;
}

.tooltip {
    position: absolute;
    top: -40px;
    background: #333;
    color: white;
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 13px;
    opacity: 0.9;
}

.tooltip::after {
    content: "";
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 7px;
    border-style: solid;
    border-color: #333 transparent transparent transparent;
}
</style>
</html>
