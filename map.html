<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Route Viewer</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>

  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // 1) Set your token (IMPORTANT: restrict it in Mapbox dashboard)
    mapboxgl.accessToken = "pk.eyJ1Ijoib2Nvbm5vcmxpYW0iLCJhIjoiY21qZzQ4ZzcyMHUwZDNkcXpxeXFucDFjYSJ9.jDT-U0Cx4SYsrBJCK2fDHQ";

    // 2) Read route name from URL: map.html?route=test-route
    const params = new URLSearchParams(window.location.search);
    const routeName = params.get("route") || "test-route";
    const geojsonUrl = `/${routeName}.geojson`;

    // 3) Create the map
    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/streets-v12",
      center: [-6.582098007202148, 53.37649336137619], // default (Dublin-ish) - will auto-fit later
      zoom: 12
    });

    map.addControl(new mapboxgl.NavigationControl());

    // 4) Load GeoJSON, then render
    map.on("load", async () => {
      const res = await fetch(geojsonUrl);
      if (!res.ok) {
        alert(`Could not load route: ${geojsonUrl}`);
        return;
      }
      const data = await res.json();

      // Add source
      map.addSource("routeData", { type: "geojson", data });

      // Draw route line (LineString features)
      map.addLayer({
        id: "routeLine",
        type: "line",
        source: "routeData",
        filter: ["==", ["geometry-type"], "LineString"],
        paint: {
          "line-width": 5
        }
      });

      // Draw manoeuvre points (Point features)
      map.addLayer({
        id: "routePoints",
        type: "circle",
        source: "routeData",
        filter: ["==", ["geometry-type"], "Point"],
        paint: {
          "circle-radius": 7
        }
      });

      // Click points -> show popup text
      map.on("click", "routePoints", (e) => {
        const f = e.features[0];
        const coords = f.geometry.coordinates.slice();
        const props = f.properties || {};
        const title = props.title || props.name || "Manoeuvre";
        const desc = props.description || props.note || "";

        new mapboxgl.Popup()
          .setLngLat(coords)
          .setHTML(`<strong>${title}</strong><br/>${desc}`)
          .addTo(map);
      });

      map.on("mouseenter", "routePoints", () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", "routePoints", () => map.getCanvas().style.cursor = "");

      // Auto-fit camera to everything
      const bounds = new mapboxgl.LngLatBounds();
      const addCoordsToBounds = (geom) => {
        if (!geom) return;
        if (geom.type === "Point") bounds.extend(geom.coordinates);
        if (geom.type === "LineString") geom.coordinates.forEach(c => bounds.extend(c));
        if (geom.type === "MultiLineString") geom.coordinates.flat().forEach(c => bounds.extend(c));
      };

      if (data.type === "FeatureCollection") {
        data.features.forEach(ft => addCoordsToBounds(ft.geometry));
      } else if (data.type === "Feature") {
        addCoordsToBounds(data.geometry);
      }

      if (!bounds.isEmpty()) {
        map.fitBounds(bounds, { padding: 60 });
      }
    });
  </script>
</body>
</html>
