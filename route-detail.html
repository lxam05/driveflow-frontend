<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Detailed view of a specific driving test route. See the exact route, junctions, and maneuvers required for your test.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.driveflow.ie/route-detail.html">
<link rel="icon" href="https://www.driveflow.ie/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="https://www.driveflow.ie/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://www.driveflow.ie/favicon.png">
<link rel="apple-touch-icon" href="https://www.driveflow.ie/favicon.png">
<title>Route Detail — DriveFlow | Detailed Driving Test Route</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-elevated: #1c2541;
        --bg-card: #2d3f5a;
        --bg-card-soft: #2d3f5a;
        --bg-card-smaller: #3a506b;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --border-strong: rgba(111, 255, 233, 0.7);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --accent-orange: #f97316;
        --accent-red: #ef4444;
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --text-soft: #6b7280;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
        --blur: 18px;
        --primary-blue: #5bc0be;
        --primary-blue-dark: #3a506b;
        --accent-purple: #6fffe9;
        --text-dark: #e5e7eb;
        --text-light: #9ca3af;
        --button-bg: #6fffe9;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        max-width: 1400px;
        margin: 96px auto 40px;
        padding: 0 20px 40px;
    }

    .page-header {
        position: relative;
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 40px;
        text-align: center;
    }

    .page-header h1 {
        margin: 0 0 12px;
        color: var(--text-main);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
    }

    .map-card {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 32px;
        margin-bottom: 24px;
    }

    .map-container {
        width: 100%;
        height: 600px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--bg-card);
        margin-top: 20px;
    }

    .map-container iframe {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: var(--radius-lg);
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.18s ease-out;
    }

    .btn-back:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
        border-color: rgba(129, 140, 248, 0.8);
    }

    /* Paywall Modal */
    .paywall-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.9);
        z-index: 10000;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .paywall-overlay.show {
        display: flex;
    }

    .paywall-content {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-xl);
        padding: 40px;
        max-width: 500px;
        width: 100%;
        text-align: center;
        box-shadow: var(--shadow-card);
    }

    .paywall-content h2 {
        margin: 0 0 16px;
        color: var(--text-main);
        font-size: 24px;
        font-weight: 700;
    }

    .paywall-content p {
        margin: 0 0 24px;
        color: var(--text-muted);
        line-height: 1.6;
    }

    .btn-upgrade {
        padding: 14px 32px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(120deg, rgba(37, 99, 235, 0.95), rgba(124, 58, 237, 0.95));
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 8px 24px rgba(30, 64, 175, 0.4);
        text-decoration: none;
        display: inline-block;
    }

    .btn-upgrade:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(30, 64, 175, 0.6);
    }
</style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1 id="routeTitle">Route Detail</h1>
        <p id="routeSubtitle">View the test route on the map</p>
    </div>

    <div class="map-card">
        <div class="map-container" id="mapContainer">
            <!-- Map will be loaded here -->
        </div>
    </div>

    <div style="text-align: center;">
        <a href="routes.html" class="btn-back">← Back to Routes</a>
    </div>
</div>

<!-- Paywall Overlay -->
<div id="paywallOverlay" class="paywall-overlay">
    <div class="paywall-content">
        <h2>Access Required</h2>
        <p id="paywallMessage">This link is invalid or has expired. Please purchase access to view route details.</p>
        <a href="routes.html" class="btn-upgrade">Go to Routes</a>
    </div>
</div>

<script>
    const API_URL = location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "http://localhost:8080"
        : "https://driving-test-backend-production.up.railway.app";

    // Validate link token on page load
    async function validateLink() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            showPaywall('No access token provided');
            return false;
        }

        const authToken = localStorage.getItem('auth_token');
        if (!authToken) {
            showPaywall('Please log in to access routes');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
            return false;
        }

        try {
            const response = await fetch(`${API_URL}/routes/validate-link/${token}`, {
                headers: {
                    'Authorization': `Bearer ${authToken}`
                }
            });

            const data = await response.json();

            if (!data.valid) {
                showPaywall(data.error || 'Link is invalid or expired');
                setTimeout(() => {
                    window.location.href = 'routes.html';
                }, 3000);
                return false;
            }

            return true;
        } catch (err) {
            console.error('Error validating link:', err);
            showPaywall('Failed to validate link. Please try again.');
            return false;
        }
    }

    function showPaywall(message) {
        const overlay = document.getElementById('paywallOverlay');
        const messageEl = document.getElementById('paywallMessage');
        if (message) {
            messageEl.textContent = message;
        }
        overlay.classList.add('show');
        // Hide main content
        document.querySelector('.container').style.display = 'none';
    }

    // Validate on page load
    validateLink().then(isValid => {
        if (!isValid) {
            return; // Don't load route content
        }
        // Continue with existing route loading logic
    });
</script>

<script>
    // Route map data - Naas Route 1
    const routeMaps = {
        "Naas": {
            1: "https://www.google.com/maps/embed?pb=!1m24!1m12!1m3!1d2392.3209759120805!2d-6.672736206632921!3d53.215405718358674!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m9!3e2!4m3!3m2!1d53.214074399999994!2d-6.6702406!4m3!3m2!1d53.2156995!2d-6.6744715!5e1!3m2!1sen!2sie!4v1763861348751!5m2!1sen!2sie",
            2: null,
            3: null,
            4: null,
            5: null,
            6: null,
            7: null
        }
    };

    // Get route parameters
    const urlParams = new URLSearchParams(window.location.search);
    const centre = urlParams.get('centre');
    const route = urlParams.get('route');

    // Update title
    if (centre && route) {
        document.getElementById('routeTitle').textContent = `${centre} Route ${route}`;
        document.getElementById('routeSubtitle').textContent = `Practice this test route`;
    }

    // Load map
    const mapContainer = document.getElementById('mapContainer');
    if (centre && route && routeMaps[centre] && routeMaps[centre][route]) {
        const iframe = document.createElement('iframe');
        iframe.src = routeMaps[centre][route];
        iframe.width = "100%";
        iframe.height = "600";
        iframe.style.border = "0";
        iframe.allowFullscreen = true;
        iframe.loading = "lazy";
        iframe.referrerPolicy = "no-referrer-when-downgrade";
        mapContainer.appendChild(iframe);
    } else if (centre && route && routeMaps[centre] && routeMaps[centre].hasOwnProperty(route)) {
        // Route exists but map not yet available
        mapContainer.innerHTML = `
            <div style="padding: 60px; text-align: center; color: var(--text-muted);">
                <div style="font-size: 48px; margin-bottom: 20px;">🗺️</div>
                <div style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Route map coming soon</div>
                <div style="font-size: 14px;">This route map will be available shortly</div>
            </div>
        `;
    } else {
        mapContainer.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">Route map not available</div>';
    }
</script>

<script src="chatbot-widget.js"></script>

</body>
</html>
