    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

    <script>
    (function () {
        var container = document.getElementById('mapleHouseInfo');
        if (!container) return;

        function isLikelyHeading(line) {
            line = (line || '').trim();
            if (!line || line.length > 120) return false;
            if (line.endsWith(':')) return false;
            if (/^\d+\.\s/.test(line)) return true;
            if (/[.!?]$/.test(line)) return false;
            if (/^(If |You |This |There |They |Most |Are |Can |Is |What |No\.|Yes\.|Usually )/i.test(line)) return false;
            return true;
        }

        function isMajorSectionTitle(line) {
            return /^(About The Maple House|How Test Routes Work At Maple House|Core Areas Examiners|Roundabout Behaviour At Maple House|Junction Types That Cause|Speed Limit Traps Around Maple House|Common Mistakes At Maple House|Examiner Behaviour Patterns|High-Failure Locations|Test Day Flow At Maple House|Local Preparation Tips That Actually Work|Trust & Credibility|Maple House Driving Test FAQ)/.test(line.trim());
        }

        function appendHeading(line) {
            var isH3 = line.length > 42 || isMajorSectionTitle(line);
            var el = document.createElement(isH3 ? 'h3' : 'h4');
            el.textContent = line;
            container.appendChild(el);
        }

        function splitIntoBlocks(text) {
            var rawLines = text.split(/\r?\n/);
            var blocks = [];
            var buf = [];
            for (var i = 0; i < rawLines.length; i++) {
                if (rawLines[i].trim() === '') {
                    if (buf.length) {
                        blocks.push(buf);
                        buf = [];
                    }
                } else {
                    buf.push(rawLines[i].trim());
                }
            }
            if (buf.length) blocks.push(buf);
            return blocks;
        }

        function mergeColonBlocks(blocks) {
            var merged = [];
            for (var i = 0; i < blocks.length; i++) {
                var cur = blocks[i].slice();
                while (cur.length === 1 && cur[0].endsWith(':') && i + 1 < blocks.length) {
                    var nextFirst = blocks[i + 1][0];
                    if (isMajorSectionTitle(nextFirst)) break;
                    i++;
                    cur = cur.concat(blocks[i]);
                }
                merged.push(cur);
            }
            return merged;
        }

        function looksLikeListLines(lines) {
            if (lines.length < 2) return false;
            var withPeriod = 0;
            for (var i = 0; i < lines.length; i++) {
                if (/[.!?]$/.test(lines[i])) withPeriod++;
            }
            return withPeriod <= Math.floor(lines.length / 3);
        }

        function renderBlock(lines, isFirstBlock) {
            if (lines.length === 1) {
                var line = lines[0];
                if (isFirstBlock) {
                    var h2 = document.createElement('h2');
                    h2.textContent = line;
                    container.appendChild(h2);
                } else if (/^\d+\.\s/.test(line)) {
                    var h4n = document.createElement('h4');
                    h4n.textContent = line;
                    container.appendChild(h4n);
                } else if (line.charAt(line.length - 1) === '?') {
                    var h4q = document.createElement('h4');
                    h4q.textContent = line;
                    container.appendChild(h4q);
                } else if (isLikelyHeading(line)) {
                    appendHeading(line);
                } else {
                    var p = document.createElement('p');
                    p.textContent = line;
                    container.appendChild(p);
                }
                return;
            }

            if (lines[0].endsWith(':')) {
                var pIntro = document.createElement('p');
                pIntro.textContent = lines[0];
                container.appendChild(pIntro);
                var rest = lines.slice(1);
                if (rest.length === 1 && /[.!?]$/.test(rest[0])) {
                    var pOne = document.createElement('p');
                    pOne.textContent = rest[0];
                    container.appendChild(pOne);
                } else if (looksLikeListLines(rest)) {
                    var ul = document.createElement('ul');
                    for (var j = 0; j < rest.length; j++) {
                        var li = document.createElement('li');
                        li.textContent = rest[j];
                        ul.appendChild(li);
                    }
                    container.appendChild(ul);
                } else {
                    for (var k = 0; k < rest.length; k++) {
                        var pr = document.createElement('p');
                        pr.textContent = rest[k];
                        container.appendChild(pr);
                    }
                }
                return;
            }

            if (isLikelyHeading(lines[0])) {
                appendHeading(lines[0]);
                var tail = lines.slice(1);
                if (tail.length === 1 && /[.!?]$/.test(tail[0])) {
                    var pTail = document.createElement('p');
                    pTail.textContent = tail[0];
                    container.appendChild(pTail);
                } else if (looksLikeListLines(tail)) {
                    var ul2 = document.createElement('ul');
                    for (var t = 0; t < tail.length; t++) {
                        var li2 = document.createElement('li');
                        li2.textContent = tail[t];
                        ul2.appendChild(li2);
                    }
                    container.appendChild(ul2);
                } else {
                    var pJoin = document.createElement('p');
                    pJoin.textContent = tail.join(' ');
                    container.appendChild(pJoin);
                }
                return;
            }

            var pFallback = document.createElement('p');
            pFallback.textContent = lines.join(' ');
            container.appendChild(pFallback);
        }

        fetch('txt%20files/maplehouse.txt')
            .then(function (r) {
                return r.ok ? r.text() : Promise.reject(new Error('Failed to fetch maplehouse.txt'));
            })
            .then(function (text) {
                var trimmed = text.trim();
                if (!trimmed) return;
                container.innerHTML = '';
                var blocks = mergeColonBlocks(splitIntoBlocks(trimmed));
                for (var b = 0; b < blocks.length; b++) {
                    renderBlock(blocks[b], b === 0);
                }
            })
            .catch(function (err) {
                console.error('Failed to load Maple House text file:', err);
            });
    })();
    </script>
