<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Your Purchase | DriveFlow</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-card: #2d3f5a;
        --bg-card-smaller: #3a506b;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .payment-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .payment-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        width: 100%;
        max-width: 1200px;
    }

    @media (max-width: 1024px) {
        .payment-layout {
            grid-template-columns: 1fr;
            gap: 32px;
        }
    }

    .payment-section,
    .benefits-section {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-xl);
        padding: 40px;
        box-shadow: var(--shadow-card);
    }

    .payment-section h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 800;
        color: var(--text-main);
    }

    .payment-section .subtitle {
        margin: 0 0 32px;
        color: var(--text-muted);
        font-size: 16px;
    }

    .price-display {
        font-size: 36px;
        font-weight: 800;
        color: var(--primary);
        margin: 24px 0;
        text-align: center;
    }

    #payment-element {
        padding: 24px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        margin-bottom: 20px;
        min-height: 400px;
    }

    #payment-errors {
        padding: 12px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 8px;
        margin-bottom: 16px;
        color: #ef4444;
        font-size: 14px;
        display: none;
    }

    .btn-submit {
        width: 100%;
        padding: 16px 32px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(120deg, rgba(37, 99, 235, 0.95), rgba(124, 58, 237, 0.95));
        color: white;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 20px;
        box-shadow: 0 8px 24px rgba(30, 64, 175, 0.4);
    }

    .btn-submit:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(30, 64, 175, 0.6);
    }

    .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        border-radius: 999px;
        border: 1px solid var(--border-subtle);
        background: transparent;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s ease;
        width: 100%;
        text-align: center;
    }

    .btn-back:hover {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.3);
        color: #ef4444;
    }

    .benefits-section h2 {
        margin: 0 0 24px;
        font-size: 24px;
        font-weight: 800;
        color: var(--text-main);
    }

    .benefits-content {
        color: var(--text-muted);
        font-size: 16px;
        line-height: 1.7;
    }

    .benefits-content p {
        margin: 0 0 16px;
    }

    .loading-state {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
    }

    .spinner {
        border: 3px solid var(--border-subtle);
        border-top: 3px solid var(--primary);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>

<div class="payment-container">
    <div class="payment-layout">
        <!-- Payment Form Section (Left) -->
        <div class="payment-section">
            <h1>Complete Your Purchase</h1>
            <p class="subtitle">Secure payment powered by Stripe</p>
            
            <div class="price-display" id="priceDisplay">€13.99</div>

            <div id="loadingState" class="loading-state" style="display: none;">
                <div class="spinner"></div>
                <p>Loading payment form...</p>
            </div>

            <div id="paymentFormContainer" style="display: none;">
                <div id="payment-element"></div>
                <div id="payment-errors" role="alert"></div>
                <button id="submitPaymentBtn" class="btn-submit">
                    <span id="submitPaymentText">Pay Now</span>
                    <span id="submitPaymentSpinner" style="display: none;">Processing...</span>
                </button>
            </div>

            <a href="routes.html" class="btn-back">← Back to Routes</a>
        </div>

        <!-- Why Buy Section (Right) -->
        <div class="benefits-section">
            <h2>Why Buy This?</h2>
            <div class="benefits-content" id="benefitsContent">
                <!-- Content will be added here by user -->
                <p>Your content will appear here.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://driving-test-backend-production.up.railway.app';
    let stripe = null;
    let elements = null;
    let paymentElement = null;
    let currentPaymentIntentId = null;

    // Get purchase info from URL params (currently only bundle is supported)
    const urlParams = new URLSearchParams(window.location.search);
    const purchaseType = urlParams.get('type') || 'bundle';
    const price = 1399; // €13.99 - Full bundle only for now

    // Update price display
    document.getElementById('priceDisplay').textContent = `€${(price / 100).toFixed(2)}`;

    // Initialize payment
    async function initializePayment() {
        const token = localStorage.getItem('auth_token');
        
        if (!token) {
            alert('Please log in to complete your purchase');
            window.location.href = 'login.html';
            return;
        }

        document.getElementById('loadingState').style.display = 'block';

        try {
            // Initialize Stripe
            const keyResponse = await fetch(`${API_URL}/routes/publishable-key`);
            if (!keyResponse.ok) {
                throw new Error('Failed to get Stripe key');
            }
            const keyData = await keyResponse.json();
            stripe = Stripe(keyData.publishableKey);

            // Create payment intent (backend uses default price from env var)
            const response = await fetch(`${API_URL}/routes/create-payment-intent`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                let errorData;
                try {
                    errorData = await response.json();
                } catch (e) {
                    errorData = { error: `Server error: ${response.status}` };
                }
                throw new Error(errorData.error || errorData.details || 'Failed to create payment');
            }

            const data = await response.json();
            
            if (!data.clientSecret || !data.paymentIntentId) {
                throw new Error('Invalid response from server');
            }

            currentPaymentIntentId = data.paymentIntentId;

            // Create payment element
            elements = stripe.elements({
                clientSecret: data.clientSecret,
                appearance: { theme: 'night' }
            });

            paymentElement = elements.create('payment');
            paymentElement.mount('#payment-element');

            // Show payment form
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('paymentFormContainer').style.display = 'block';

        } catch (err) {
            console.error('Payment initialization error:', err);
            document.getElementById('loadingState').innerHTML = `
                <div style="color: #ef4444;">
                    <p><strong>Error:</strong> ${err.message || 'Failed to initialize payment'}</p>
                    <p style="margin-top: 16px; font-size: 14px;">Please try refreshing the page or contact support.</p>
                </div>
            `;
        }
    }

    // Handle payment submission
    async function handlePaymentSubmit() {
        if (!stripe || !paymentElement) {
            alert('Payment form not ready. Please wait...');
            return;
        }

        const submitBtn = document.getElementById('submitPaymentBtn');
        submitBtn.disabled = true;
        document.getElementById('submitPaymentText').style.display = 'none';
        document.getElementById('submitPaymentSpinner').style.display = 'inline';
        document.getElementById('payment-errors').style.display = 'none';

        try {
            const { error } = await stripe.confirmPayment({
                elements,
                confirmParams: {
                    return_url: `${window.location.origin}/routes.html?payment=success`
                },
                redirect: 'if_required'
            });

            if (error) {
                document.getElementById('payment-errors').textContent = error.message;
                document.getElementById('payment-errors').style.display = 'block';
                submitBtn.disabled = false;
                document.getElementById('submitPaymentText').style.display = 'inline';
                document.getElementById('submitPaymentSpinner').style.display = 'none';
            } else {
                // Payment succeeded
                alert('Payment successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/routes.html?payment=success';
                }, 1000);
            }
        } catch (err) {
            console.error('Payment error:', err);
            document.getElementById('payment-errors').textContent = err.message || 'Payment failed. Please try again.';
            document.getElementById('payment-errors').style.display = 'block';
            submitBtn.disabled = false;
            document.getElementById('submitPaymentText').style.display = 'inline';
            document.getElementById('submitPaymentSpinner').style.display = 'none';
        }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
        initializePayment();
    });

    // Submit button handler
    document.getElementById('submitPaymentBtn').addEventListener('click', handlePaymentSubmit);
</script>

<script src="chatbot-widget.js"></script>

</body>
</html>
