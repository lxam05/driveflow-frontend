<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Test Routes | DriveFlow</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-elevated: #1c2541;
        --bg-card: #2d3f5a;
        --bg-card-soft: #2d3f5a;
        --bg-card-smaller: #3a506b;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --border-strong: rgba(111, 255, 233, 0.7);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --accent-orange: #f97316;
        --accent-red: #ef4444;
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --text-soft: #6b7280;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
        --blur: 18px;
        --primary-blue: #5bc0be;
        --primary-blue-dark: #3a506b;
        --accent-purple: #6fffe9;
        --text-dark: #e5e7eb;
        --text-light: #9ca3af;
        --button-bg: #6fffe9;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        max-width: 1400px;
        margin: 96px auto 40px;
        padding: 0 20px 40px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: start;
    }

    @media (max-width: 1024px) {
        .container {
            grid-template-columns: 1fr;
        }
    }

    .page-header {
        position: relative;
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 40px;
        text-align: center;
        grid-column: 1 / -1;
    }

    .page-header h1 {
        margin: 0 0 12px;
        color: var(--text-main);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
    }

    .selection-card {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 32px;
        margin-bottom: 0;
    }

    .selection-card h2 {
        margin: 0 0 20px;
        font-size: 22px;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.01em;
    }

    .search-box {
        margin-bottom: 24px;
    }

    .search-input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text-main);
        font-size: 15px;
        font-family: inherit;
        transition: all 0.2s ease;
    }

    .search-input:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(15, 23, 42, 0.8);
    }

    .search-input::placeholder {
        color: var(--text-muted);
    }

    .centres-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: calc(100vh - 300px);
        overflow-y: auto;
        padding-right: 8px;
    }

    .centres-list::-webkit-scrollbar {
        width: 8px;
    }

    .centres-list::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.3);
        border-radius: 4px;
    }

    .centres-list::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 4px;
    }

    .centres-list::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
    }

    .centre-card {
        padding: 16px 20px;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
    }

    .centre-card:hover {
        background: var(--primary-soft);
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }

    .centre-card.selected {
        background: var(--primary-soft);
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary);
    }

    .centre-card h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-main);
    }

    .routes-container {
        position: sticky;
        top: 120px;
    }

    .routes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 24px;
    }

    .route-card {
        padding: 20px;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        color: var(--text-main);
        display: block;
    }

    .route-card:hover {
        background: var(--primary-soft);
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }

    .route-card h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        color: var(--text-main);
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.18s ease-out;
    }

    .btn-back:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
        border-color: rgba(129, 140, 248, 0.8);
    }

    .no-routes {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
    }

    .routes-sidebar {
        position: sticky;
        top: 120px;
    }

    @media (max-width: 1024px) {
        .routes-sidebar {
            position: static;
            margin-top: 40px;
        }
    }

    /* Paywall Modal - Hidden, redirects to payment.html instead */
    /* Paywall modal CSS removed - all payment functionality moved to payment.html */

    /* All paywall CSS removed - payment functionality moved to payment.html */

    /* All payment button CSS removed - payment functionality moved to payment.html */

    .license-status.expired {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.3);
        color: #fecaca;
    }

    /* All payment form CSS removed - payment functionality moved to payment.html */
</style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1>Test Routes</h1>
        <p>Practice the actual routes used in driving tests at each centre</p>
    </div>

    <div class="selection-card">
        <h2>Select Test Centre</h2>
        <div class="search-box">
            <input type="text" class="search-input" id="centreSearch" placeholder="Search for a test centre..." autocomplete="off">
        </div>
        <div class="centres-list" id="centresGrid"></div>
    </div>

    <div class="selection-card routes-sidebar">
        <div id="routesContainer" class="no-routes" style="display: none;">
            <h2 id="selectedCentreTitle" style="margin: 0 0 20px; font-size: 20px; font-weight: 700; color: var(--text-main);">Available Routes</h2>
            <div class="routes-grid" id="routesGrid"></div>
        </div>
        <div id="noSelection" class="no-routes">
            Select a test centre to view available routes
        </div>
    </div>

    <div style="text-align: center; grid-column: 1 / -1; margin-top: 20px;">
        <a href="main.html" class="btn-back" id="backToHome">← Back to Home</a>
    </div>
</div>

<!-- Paywall Modal - REMOVED: All payment functionality moved to payment.html -->

<script>
    const API_URL = location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "http://localhost:8080"
        : "https://driving-test-backend-production.up.railway.app";

    let hasLicense = false;
    let licenseExpiresAt = null;
    let pendingRoute = null;

    // Check license status on page load
    async function checkLicenseStatus() {
        const token = localStorage.getItem('auth_token');
        if (!token) {
            hasLicense = false;
            return;
        }

        try {
            const response = await fetch(`${API_URL}/routes/license-status`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                console.log('License API response:', data);
                hasLicense = data.hasLicense || false;
                licenseExpiresAt = data.expiresAt;
                
                // Double-check expiry even if API says hasLicense is true
                if (hasLicense && licenseExpiresAt) {
                    const expiryDate = new Date(licenseExpiresAt);
                    const now = new Date();
                    if (expiryDate < now) {
                        console.log('License expired:', expiryDate, 'Current:', now);
                        hasLicense = false;
                    } else {
                        console.log('License valid until:', expiryDate);
                    }
                }
                
                console.log('Final hasLicense value:', hasLicense);
                
                // Update UI (but don't let it modify hasLicense)
                updateLicenseUI();
            } else {
                // If API call fails, assume no license
                console.log('License API call failed with status:', response.status);
                hasLicense = false;
            }
        } catch (err) {
            console.error('Error checking license:', err);
            // On error, assume no license to be safe
            hasLicense = false;
        }
    }

    function updateLicenseUI() {
        const statusDiv = document.getElementById('licenseStatus');
        if (!statusDiv) {
            // Element doesn't exist, skip UI update
            return;
        }
        
        if (hasLicense && licenseExpiresAt) {
            const expiryDate = new Date(licenseExpiresAt);
            const isExpired = expiryDate < new Date();
            statusDiv.innerHTML = isExpired 
                ? `<div class="license-status expired">Your license expired on ${expiryDate.toLocaleDateString()}</div>`
                : `<div class="license-status">✓ Active license expires ${expiryDate.toLocaleDateString()}</div>`;
            statusDiv.style.display = 'block';
            // Don't modify hasLicense here - it's already set correctly in checkLicenseStatus
        } else {
            if (statusDiv) {
                statusDiv.style.display = 'none';
            }
        }
    }

    // Handle route click
    async function handleRouteClick(centre, routeNumber, e) {
        if (e && e.preventDefault) {
            e.preventDefault();
        }
        const token = localStorage.getItem('auth_token');
        
        if (!token) {
            alert('Please log in to access routes');
            window.location.href = 'login.html';
            return;
        }

        // Always check license status first before allowing access
        await checkLicenseStatus();

        // Check license status - if no license, redirect to payment
        if (!hasLicense) {
            window.location.href = 'payment.html';
            return;
        }

        // Generate link and navigate
        try {
            const response = await fetch(`${API_URL}/routes/generate-link`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    centreName: centre.name,
                    routeNumber: routeNumber
                })
            });

            if (response.ok) {
                const data = await response.json();
                window.location.href = `route-detail.html?centre=${encodeURIComponent(centre.name)}&route=${routeNumber}&token=${data.linkToken}`;
            } else {
                const error = await response.json();
                if (error.error && error.error.includes('license')) {
                    hasLicense = false;
                    pendingRoute = { centre, routeNumber };
                    showPaywall();
                } else {
                    alert('Failed to generate link. Please try again.');
                }
            }
        } catch (err) {
            console.error('Error generating link:', err);
            alert('Failed to generate link. Please try again.');
        }
    }

    function showPaywall() {
        // Immediately redirect to payment page - never show modal
        window.location.href = 'payment.html';
    }

    function hidePaywall() {
        // Modal should never be shown, but if it is, hide it
        const modal = document.getElementById('paywallModal');
        if (modal) {
            modal.classList.remove('show');
        }
    }

    // All Stripe/payment code removed - payment functionality moved to payment.html

    // initiatePurchase removed - redirects to payment.html instead

    // resetPaymentForm removed - no payment form in this file

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', async () => {
        await checkLicenseStatus();
    });

    // Test centres data - sorted alphabetically
    const testCentres = [
        { name: "Naas", routes: 7 },
        { name: "Tallaght", routes: 7 },

    ];

    let selectedCentre = null;

    // Initialize centre cards
    function initCentres() {
        const centresGrid = document.getElementById('centresGrid');
        const searchInput = document.getElementById('centreSearch');
        
        // Render all centres
        renderCentres();
        
        // Filter centres on search
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const cards = centresGrid.querySelectorAll('.centre-card');
            
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(searchTerm) ? 'flex' : 'none';
            });
        });
    }

    // Render centre cards
    function renderCentres() {
        const centresGrid = document.getElementById('centresGrid');
        centresGrid.innerHTML = '';
        
        testCentres.forEach(centre => {
            const card = document.createElement('div');
            card.className = 'centre-card';
            card.innerHTML = `<h3>${centre.name}</h3>`;
            card.addEventListener('click', () => {
                selectCentre(centre);
                // Update selected state
                document.querySelectorAll('.centre-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
            });
            centresGrid.appendChild(card);
        });
    }

    // Select a test centre
    async function selectCentre(centre) {
        // Always check license status first
        await checkLicenseStatus();
        
        // Debug: log the license status
        console.log('selectCentre - hasLicense:', hasLicense, 'centre:', centre.name);
        
        // If no license, redirect to payment page
        if (!hasLicense) {
            console.log('No license - redirecting to payment.html');
            window.location.href = 'payment.html';
            return;
        }
        
        // User has premium access - proceed to show routes
        console.log('Has license - proceeding to routes');
        
        // Special handling for Naas and Tallaght - redirect to dedicated pages
        if (centre.name === "Naas") {
            window.location.href = 'naas-routes.html';
            return;
        }
        
        if (centre.name === "Tallaght") {
            window.location.href = 'tallaght-routes.html';
            return;
        }
        
        // For other centres, show routes directly on this page
        selectedCentre = centre;
        renderRoutes(centre);
    }

    // Render routes for selected centre
    function renderRoutes(centre) {
        const routesContainer = document.getElementById('routesContainer');
        const routesGrid = document.getElementById('routesGrid');
        const noSelection = document.getElementById('noSelection');
        const selectedCentreTitle = document.getElementById('selectedCentreTitle');
        
        routesGrid.innerHTML = '';
        
        for (let i = 1; i <= centre.routes; i++) {
            const routeCard = document.createElement('div');
            routeCard.className = 'route-card';
            routeCard.innerHTML = `<h3>Click a route</h3>`;
            routeCard.addEventListener('click', (e) => handleRouteClick(centre, i, e));
            routesGrid.appendChild(routeCard);
        }
        
        selectedCentreTitle.textContent = `Routes for ${centre.name}`;
        routesContainer.style.display = 'block';
        noSelection.style.display = 'none';
    }


    // Initialize
    initCentres();

    // All payment-related actions now redirect to payment.html
    // Modal handlers removed since modal HTML is removed
</script>

<script src="chatbot-widget.js"></script>

</body>
</html>
