<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Routes | DriveFlow</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-elevated: #1c2541;
        --bg-card: #2d3f5a;
        --bg-card-soft: #2d3f5a;
        --bg-card-smaller: #3a506b;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --border-strong: rgba(111, 255, 233, 0.7);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --accent-orange: #f97316;
        --accent-red: #ef4444;
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --text-soft: #6b7280;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
        --blur: 18px;
        --primary-blue: #5bc0be;
        --primary-blue-dark: #3a506b;
        --accent-purple: #6fffe9;
        --text-dark: #e5e7eb;
        --text-light: #9ca3af;
        --button-bg: #6fffe9;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        max-width: 1400px;
        margin: 96px auto 40px;
        padding: 0 20px 40px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: start;
    }

    @media (max-width: 1024px) {
        .container {
            grid-template-columns: 1fr;
        }
    }

    .page-header {
        position: relative;
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 40px;
        text-align: center;
        grid-column: 1 / -1;
    }

    .page-header h1 {
        margin: 0 0 12px;
        color: var(--text-main);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
    }

    .selection-card {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 32px;
        margin-bottom: 0;
    }

    .selection-card h2 {
        margin: 0 0 20px;
        font-size: 22px;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.01em;
    }

    .search-box {
        margin-bottom: 24px;
    }

    .search-input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text-main);
        font-size: 15px;
        font-family: inherit;
        transition: all 0.2s ease;
    }

    .search-input:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(15, 23, 42, 0.8);
    }

    .search-input::placeholder {
        color: var(--text-muted);
    }

    .centres-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: calc(100vh - 300px);
        overflow-y: auto;
        padding-right: 8px;
    }

    .centres-list::-webkit-scrollbar {
        width: 8px;
    }

    .centres-list::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.3);
        border-radius: 4px;
    }

    .centres-list::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 4px;
    }

    .centres-list::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
    }

    .centre-card {
        padding: 16px 20px;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
    }

    .centre-card:hover {
        background: var(--primary-soft);
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }

    .centre-card.selected {
        background: var(--primary-soft);
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary);
    }

    .centre-card h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-main);
    }

    .routes-container {
        position: sticky;
        top: 120px;
    }

    .routes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 24px;
    }

    .route-card {
        padding: 20px;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        color: var(--text-main);
        display: block;
    }

    .route-card:hover {
        background: var(--primary-soft);
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }

    .route-card h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        color: var(--text-main);
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.18s ease-out;
    }

    .btn-back:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
        border-color: rgba(129, 140, 248, 0.8);
    }

    .no-routes {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
    }

    .routes-sidebar {
        position: sticky;
        top: 120px;
    }

    @media (max-width: 1024px) {
        .routes-sidebar {
            position: static;
            margin-top: 40px;
        }
    }

    /* Paywall Modal */
    .paywall-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .paywall-modal.show {
        display: flex;
    }

    .paywall-content {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-xl);
        padding: 40px;
        max-width: 500px;
        width: 100%;
        text-align: center;
        box-shadow: var(--shadow-card);
    }

    .paywall-content h2 {
        margin: 0 0 16px;
        color: var(--text-main);
        font-size: 24px;
        font-weight: 700;
    }

    .paywall-content p {
        margin: 0 0 24px;
        color: var(--text-muted);
        line-height: 1.6;
    }

    .btn-purchase {
        padding: 14px 32px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(120deg, rgba(37, 99, 235, 0.95), rgba(124, 58, 237, 0.95));
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 8px 24px rgba(30, 64, 175, 0.4);
    }

    .btn-purchase:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(30, 64, 175, 0.6);
    }

    .btn-purchase:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .license-status {
        padding: 12px 20px;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 12px;
        margin-bottom: 20px;
        font-size: 14px;
        color: #bbf7d0;
    }

    .license-status.expired {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.3);
        color: #fecaca;
    }
</style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1>Test Routes</h1>
        <p>Practice the actual routes used in driving tests at each centre</p>
    </div>

    <div class="selection-card">
        <h2>Select Test Centre</h2>
        <div class="search-box">
            <input type="text" class="search-input" id="centreSearch" placeholder="Search for a test centre..." autocomplete="off">
        </div>
        <div class="centres-list" id="centresGrid"></div>
    </div>

    <div class="selection-card routes-sidebar">
        <div id="routesContainer" class="no-routes" style="display: none;">
            <h2 id="selectedCentreTitle" style="margin: 0 0 20px; font-size: 20px; font-weight: 700; color: var(--text-main);">Available Routes</h2>
            <div class="routes-grid" id="routesGrid"></div>
        </div>
        <div id="noSelection" class="no-routes">
            Select a test centre to view available routes
        </div>
    </div>

    <div style="text-align: center; grid-column: 1 / -1; margin-top: 20px;">
        <a href="main.html" class="btn-back" id="backToHome">← Back to Home</a>
    </div>
</div>

<!-- Paywall Modal -->
<div id="paywallModal" class="paywall-modal">
    <div class="paywall-content">
        <h2>Access Required</h2>
        <p>You need a 3-month license to access route details. Purchase access to view all driving test routes.</p>
        <div id="licenseStatus"></div>
        <button id="purchaseBtn" class="btn-purchase">Buy 3-Month Access</button>
        <button id="closePaywallBtn" style="margin-top: 12px; background: transparent; border: 1px solid var(--border-subtle); color: var(--text-muted); padding: 8px 20px; border-radius: 999px; cursor: pointer;">Cancel</button>
    </div>
</div>

<script>
    const API_URL = location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "http://localhost:8080"
        : "https://driving-test-backend-production.up.railway.app";

    let hasLicense = false;
    let licenseExpiresAt = null;
    let pendingRoute = null;

    // Check license status on page load
    async function checkLicenseStatus() {
        const token = localStorage.getItem('auth_token');
        if (!token) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/routes/license-status`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                hasLicense = data.hasLicense;
                licenseExpiresAt = data.expiresAt;
                updateLicenseUI();
            }
        } catch (err) {
            console.error('Error checking license:', err);
        }
    }

    function updateLicenseUI() {
        const statusDiv = document.getElementById('licenseStatus');
        if (hasLicense && licenseExpiresAt) {
            const expiryDate = new Date(licenseExpiresAt);
            const isExpired = expiryDate < new Date();
            statusDiv.innerHTML = isExpired 
                ? `<div class="license-status expired">Your license expired on ${expiryDate.toLocaleDateString()}</div>`
                : `<div class="license-status">✓ Active license expires ${expiryDate.toLocaleDateString()}</div>`;
            statusDiv.style.display = 'block';
            hasLicense = !isExpired;
        } else {
            statusDiv.style.display = 'none';
        }
    }

    // Handle route click
    async function handleRouteClick(centre, routeNumber, e) {
        e.preventDefault();
        const token = localStorage.getItem('auth_token');
        
        if (!token) {
            alert('Please log in to access routes');
            window.location.href = 'login.html';
            return;
        }

        // Check license status
        if (!hasLicense) {
            pendingRoute = { centre, routeNumber };
            showPaywall();
            return;
        }

        // Generate link and navigate
        try {
            const response = await fetch(`${API_URL}/routes/generate-link`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    centreName: centre.name,
                    routeNumber: routeNumber
                })
            });

            if (response.ok) {
                const data = await response.json();
                window.location.href = `route-detail.html?centre=${encodeURIComponent(centre.name)}&route=${routeNumber}&token=${data.linkToken}`;
            } else {
                const error = await response.json();
                if (error.error && error.error.includes('license')) {
                    hasLicense = false;
                    pendingRoute = { centre, routeNumber };
                    showPaywall();
                } else {
                    alert('Failed to generate link. Please try again.');
                }
            }
        } catch (err) {
            console.error('Error generating link:', err);
            alert('Failed to generate link. Please try again.');
        }
    }

    function showPaywall() {
        document.getElementById('paywallModal').classList.add('show');
    }

    function hidePaywall() {
        document.getElementById('paywallModal').classList.remove('show');
    }

    async function initiatePurchase() {
        const token = localStorage.getItem('auth_token');
        if (!token) {
            alert('Please log in to purchase');
            window.location.href = 'login.html';
            return;
        }

        const btn = document.getElementById('purchaseBtn');
        btn.disabled = true;
        btn.textContent = 'Processing...';

        try {
            const response = await fetch(`${API_URL}/routes/checkout`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                // Redirect to Stripe Checkout
                window.location.href = data.url;
            } else {
                const error = await response.json();
                alert(error.error || 'Failed to start checkout');
                btn.disabled = false;
                btn.textContent = 'Buy 3-Month Access';
            }
        } catch (err) {
            console.error('Error initiating purchase:', err);
            alert('Failed to start checkout. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Buy 3-Month Access';
        }
    }

    // Check for payment success
    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('payment') === 'success') {
            // Wait a moment for webhook to process
            await new Promise(resolve => setTimeout(resolve, 2000));
            await checkLicenseStatus();
            alert('Payment successful! Your license is now active. You can now access route details.');
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
        } else if (urlParams.get('payment') === 'cancelled') {
            alert('Payment was cancelled.');
            window.history.replaceState({}, document.title, window.location.pathname);
        } else {
            checkLicenseStatus();
        }
    });

    // Test centres data - sorted alphabetically
    const testCentres = [
        { name: "Athlone", routes: 7 },
        { name: "Ballina", routes: 7 },
        { name: "Birr", routes: 7 },
        { name: "Birr (County Arms Hotel)", routes: 7 },
        { name: "Buncrana", routes: 7 },
        { name: "Carlow (Talbot Hotel)", routes: 7 },
        { name: "Carrick-on-Shannon", routes: 7 },
        { name: "Castlebar", routes: 7 },
        { name: "Cavan", routes: 7 },
        { name: "Charlestown (Dublin)", routes: 7 },
        { name: "Clifden", routes: 7 },
        { name: "Clonmel", routes: 7 },
        { name: "Cork (Ballincollig)", routes: 7 },
        { name: "Cork (St. Finbarr's GAA Club, Togher)", routes: 7 },
        { name: "Cork (Wilton)", routes: 7 },
        { name: "Donegal", routes: 7 },
        { name: "Drogheda", routes: 7 },
        { name: "Dundalk", routes: 7 },
        { name: "Dungarvan", routes: 7 },
        { name: "Dún Laoghaire / Deansgrange", routes: 7 },
        { name: "Ennis", routes: 7 },
        { name: "Finglas", routes: 7 },
        { name: "Galway (Carnmore)", routes: 7 },
        { name: "Galway (Westside)", routes: 7 },
        { name: "Gorey", routes: 7 },
        { name: "Killarney", routes: 7 },
        { name: "Kilkenny (Government Buildings)", routes: 7 },
        { name: "Kilkenny (O'Loughlin Gaels)", routes: 7 },
        { name: "Killester", routes: 7 },
        { name: "Kilrush", routes: 7 },
        { name: "Letterkenny", routes: 7 },
        { name: "Limerick (Castlemungret)", routes: 7 },
        { name: "Limerick (Woodview)", routes: 7 },
        { name: "Longford", routes: 7 },
        { name: "Loughrea", routes: 7 },
        { name: "Loughrea (Lough Rea Hotel & Spa)", routes: 7 },
        { name: "Mallow (Cork Racecourse, Mallow)", routes: 7 },
        { name: "Monaghan", routes: 7 },
        { name: "Mulhuddart", routes: 7 },
        { name: "Mulhuddart (Carlton Hotel)", routes: 7 },
        { name: "Mullingar", routes: 7 },
        { name: "Naas", routes: 7 },
        { name: "Navan", routes: 7 },
        { name: "Nenagh", routes: 7 },
        { name: "Newcastle West", routes: 7 },
        { name: "Newcastle West (Longcourt House Hotel)", routes: 7 },
        { name: "Portlaoise", routes: 7 },
        { name: "Raheny", routes: 7 },
        { name: "Roscommon", routes: 7 },
        { name: "Shannon", routes: 7 },
        { name: "Skibbereen", routes: 7 },
        { name: "Sligo", routes: 7 },
        { name: "Tallaght", routes: 7 },
        { name: "Thurles", routes: 7 },
        { name: "Tipperary", routes: 7 },
        { name: "Tralee", routes: 7 },
        { name: "Tuam", routes: 7 },
        { name: "Tullamore", routes: 7 },
        { name: "Waterford", routes: 7 },
        { name: "Wexford", routes: 7 },
        { name: "Wicklow", routes: 7 }
    ];

    let selectedCentre = null;

    // Initialize centre cards
    function initCentres() {
        const centresGrid = document.getElementById('centresGrid');
        const searchInput = document.getElementById('centreSearch');
        
        // Render all centres
        renderCentres();
        
        // Filter centres on search
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const cards = centresGrid.querySelectorAll('.centre-card');
            
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(searchTerm) ? 'flex' : 'none';
            });
        });
    }

    // Render centre cards
    function renderCentres() {
        const centresGrid = document.getElementById('centresGrid');
        centresGrid.innerHTML = '';
        
        testCentres.forEach(centre => {
            const card = document.createElement('div');
            card.className = 'centre-card';
            card.innerHTML = `<h3>${centre.name}</h3>`;
            card.addEventListener('click', () => {
                selectCentre(centre);
                // Update selected state
                document.querySelectorAll('.centre-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
            });
            centresGrid.appendChild(card);
        });
    }

    // Select a test centre
    function selectCentre(centre) {
        selectedCentre = centre;
        renderRoutes(centre);
    }

    // Render routes for selected centre
    function renderRoutes(centre) {
        const routesContainer = document.getElementById('routesContainer');
        const routesGrid = document.getElementById('routesGrid');
        const noSelection = document.getElementById('noSelection');
        const selectedCentreTitle = document.getElementById('selectedCentreTitle');
        
        routesGrid.innerHTML = '';
        
        for (let i = 1; i <= centre.routes; i++) {
            const routeCard = document.createElement('div');
            routeCard.className = 'route-card';
            routeCard.innerHTML = `<h3>Route ${i}</h3>`;
            routeCard.addEventListener('click', (e) => handleRouteClick(centre, i, e));
            routesGrid.appendChild(routeCard);
        }
        
        selectedCentreTitle.textContent = `Routes for ${centre.name}`;
        routesContainer.style.display = 'block';
        noSelection.style.display = 'none';
    }


    // Initialize
    initCentres();

    // Paywall modal handlers
    document.getElementById('purchaseBtn').addEventListener('click', initiatePurchase);
    document.getElementById('closePaywallBtn').addEventListener('click', hidePaywall);
    document.getElementById('paywallModal').addEventListener('click', (e) => {
        if (e.target.id === 'paywallModal') {
            hidePaywall();
        }
    });
</script>

<script src="chatbot-widget.js"></script>

</body>
</html>
