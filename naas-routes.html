<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naas Test Routes | DriveFlow</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-elevated: #1c2541;
        --bg-card: #2d3f5a;
        --bg-card-soft: #2d3f5a;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --border-strong: rgba(111, 255, 233, 0.7);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        max-width: 1200px;
        margin: 96px auto 40px;
        padding: 0 20px 40px;
    }

    .page-header {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 40px;
        text-align: center;
    }

    .page-header h1 {
        margin: 0 0 12px;
        color: var(--text-main);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
    }

    .routes-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
        margin-top: 24px;
    }

    .route-card {
        padding: 24px;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        transition: all 0.2s ease;
    }

    .route-card:hover {
        background: var(--primary-soft);
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(91, 192, 190, 0.3);
    }

    .route-card h3 {
        margin: 0 0 16px;
        font-size: 20px;
        font-weight: 700;
        color: var(--text-main);
    }

    .route-btn {
        width: 100%;
        padding: 12px 24px;
        background: var(--primary);
        color: var(--bg-main);
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .route-btn:hover {
        background: var(--accent);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(111, 255, 233, 0.4);
    }

    .route-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
    }

    .error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin: 20px 0;
        color: #ef4444;
    }

    .expiry-info {
        background: var(--primary-soft);
        border: 1px solid var(--primary);
        border-radius: var(--radius-lg);
        padding: 16px;
        margin-bottom: 24px;
        text-align: center;
        color: var(--text-main);
        font-size: 14px;
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.18s ease-out;
    }

    .btn-back:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
        border-color: rgba(129, 140, 248, 0.8);
    }

    /* Paywall Modal */
    .paywall-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .paywall-modal.show {
        display: flex;
    }

    .paywall-content {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-xl);
        padding: 40px;
        max-width: 500px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        text-align: center;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
    }
    
    .paywall-content::-webkit-scrollbar {
        width: 8px;
    }
    
    .paywall-content::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.3);
        border-radius: 4px;
    }
    
    .paywall-content::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 4px;
    }
    
    .paywall-content::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
    }

    .paywall-content h2 {
        margin: 0 0 16px;
        color: var(--text-main);
        font-size: 24px;
        font-weight: 700;
    }

    .paywall-content p {
        margin: 0 0 24px;
        color: var(--text-muted);
        line-height: 1.6;
    }

    .btn-purchase {
        padding: 14px 32px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(120deg, rgba(37, 99, 235, 0.95), rgba(124, 58, 237, 0.95));
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 8px 24px rgba(30, 64, 175, 0.4);
    }

    .btn-purchase:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(30, 64, 175, 0.6);
    }

    .btn-purchase:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .license-status {
        padding: 12px 20px;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 12px;
        margin-bottom: 20px;
        font-size: 14px;
        color: #bbf7d0;
    }

    .license-status.expired {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.3);
        color: #fecaca;
    }

    /* Payment Form Styling */
    #payment-element {
        padding: 20px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        margin-bottom: 20px;
        min-height: 0;
        flex-shrink: 0;
    }
    
    #paymentForm {
        flex-shrink: 0;
        margin-top: 24px;
        display: flex;
        flex-direction: column;
    }
    
    #submitPaymentBtn {
        margin-top: 20px;
        flex-shrink: 0;
    }

    #payment-errors {
        padding: 12px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 8px;
        margin-bottom: 16px;
    }

    #submitPaymentBtn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #purchaseButtonContainer {
        display: block;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Naas Test Routes</h1>
            <p>Access detailed route information for the Naas test centre</p>
        </div>

        <div id="errorContainer"></div>
        <div id="expiryInfo" class="expiry-info" style="display: none;"></div>
        <div id="routesContainer" class="routes-container"></div>
        <div id="loadingContainer" class="loading">Loading routes...</div>

        <a href="routes.html" class="btn-back">← Back to All Routes</a>
    </div>

<!-- Paywall Modal -->
<div id="paywallModal" class="paywall-modal">
    <div class="paywall-content">
        <h2>Access Required</h2>
        <p>You need a 3-month license to access route details. Purchase access to view all driving test routes.</p>
        <div id="licenseStatus"></div>
        
        <!-- Payment Form (hidden initially) -->
        <div id="paymentForm" style="display: none; margin-top: 24px;">
            <div id="payment-element" style="margin-bottom: 20px;">
                <!-- Stripe Elements will mount here -->
            </div>
            <div id="payment-errors" role="alert" style="color: #ef4444; font-size: 14px; margin-bottom: 16px; display: none;"></div>
            <button id="submitPaymentBtn" class="btn-purchase" style="width: 100%;">
                <span id="submitPaymentText">Pay Now</span>
                <span id="submitPaymentSpinner" style="display: none;">Processing...</span>
            </button>
            <button id="backToPurchaseBtn" style="margin-top: 12px; background: transparent; border: 1px solid var(--border-subtle); color: var(--text-muted); padding: 8px 20px; border-radius: 999px; cursor: pointer; width: 100%;">Back</button>
        </div>
        
        <!-- Initial Purchase Button -->
        <div id="purchaseButtonContainer">
            <button id="purchaseBtn" class="btn-purchase">Buy 3-Month Access</button>
            <button id="closePaywallBtn" style="margin-top: 12px; background: transparent; border: 1px solid var(--border-subtle); color: var(--text-muted); padding: 8px 20px; border-radius: 999px; cursor: pointer;">Cancel</button>
        </div>
    </div>
</div>

<!-- Load Stripe.js -->
<script src="https://js.stripe.com/v3/"></script>

    <script>
        const API_URL = location.hostname === "localhost" || location.hostname === "127.0.0.1"
            ? "http://localhost:8080"
            : "https://driving-test-backend-production.up.railway.app";
        
        let accessToken = null;
        let routesData = null;
        let tokenExpiresAt = null;
        let hasLicense = false;
        let licenseExpiresAt = null;

        // Get token from localStorage
        const token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        // Check license status on page load
        async function checkLicenseStatus() {
            const token = localStorage.getItem('auth_token');
            if (!token) {
                hasLicense = false;
                return;
            }

            try {
                const response = await fetch(`${API_URL}/routes/license-status`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    hasLicense = data.hasLicense || false;
                    licenseExpiresAt = data.expiresAt;
                    
                    // Double-check expiry even if API says hasLicense is true
                    if (hasLicense && licenseExpiresAt) {
                        const expiryDate = new Date(licenseExpiresAt);
                        if (expiryDate < new Date()) {
                            hasLicense = false;
                        }
                    }
                    
                    updateLicenseUI();
                } else {
                    // If API call fails, assume no license
                    hasLicense = false;
                }
            } catch (err) {
                console.error('Error checking license:', err);
                // On error, assume no license to be safe
                hasLicense = false;
            }
        }

        function updateLicenseUI() {
            const statusDiv = document.getElementById('licenseStatus');
            if (hasLicense && licenseExpiresAt) {
                const expiryDate = new Date(licenseExpiresAt);
                const isExpired = expiryDate < new Date();
                statusDiv.innerHTML = isExpired 
                    ? `<div class="license-status expired">Your license expired on ${expiryDate.toLocaleDateString()}</div>`
                    : `<div class="license-status">✓ Active license expires ${expiryDate.toLocaleDateString()}</div>`;
                statusDiv.style.display = 'block';
                hasLicense = !isExpired;
            } else {
                statusDiv.style.display = 'none';
            }
        }

        function showPaywall() {
            // Redirect to payment page instead of showing modal
            window.location.href = 'payment.html';
        }

        function hidePaywall() {
            document.getElementById('paywallModal').classList.remove('show');
        }

        let stripe = null;
        let elements = null;
        let paymentElement = null;
        let currentPaymentIntentId = null;

        // Initialize Stripe
        async function initializeStripe() {
            try {
                const keyResponse = await fetch(`${API_URL}/routes/publishable-key`);
                if (!keyResponse.ok) {
                    const error = await keyResponse.json().catch(() => ({ error: 'Unknown error' }));
                    throw new Error(error.details || error.error || 'Failed to get Stripe publishable key');
                }
                const data = await keyResponse.json();
                
                if (!data.publishableKey) {
                    throw new Error('No publishable key in response');
                }
                
                stripe = Stripe(data.publishableKey);
                return true;
            } catch (err) {
                console.error('Error initializing Stripe:', err);
                throw err;
            }
        }

        // Setup payment form
        async function setupPaymentForm(clientSecret) {
            if (!stripe) {
                await initializeStripe();
            }

            if (paymentElement) {
                try {
                    paymentElement.unmount();
                } catch (e) {}
                paymentElement = null;
            }
            elements = null;

            document.getElementById('paymentForm').style.display = 'block';
            document.getElementById('purchaseButtonContainer').style.display = 'none';

            await new Promise(resolve => setTimeout(resolve, 200));

            const paymentElementContainer = document.getElementById('payment-element');
            if (!paymentElementContainer) {
                throw new Error('Payment element container not found');
            }

            paymentElementContainer.innerHTML = '';

            if (!clientSecret || !clientSecret.includes('_secret_')) {
                throw new Error('Invalid client secret format');
            }

            elements = stripe.elements({
                clientSecret: clientSecret,
                appearance: {
                    theme: 'night',
                    variables: {
                        colorPrimary: '#5bc0be',
                        colorBackground: '#2d3f5a',
                        colorText: '#e5e7eb',
                        colorDanger: '#ef4444',
                        fontFamily: 'Inter, system-ui, sans-serif',
                        spacingUnit: '4px',
                        borderRadius: '12px',
                    },
                },
                locale: 'en',
            });

            paymentElement = elements.create('payment', {
                layout: 'tabs'
            });
            
            paymentElement.mount('#payment-element');

            await new Promise((resolve, reject) => {
                let attempts = 0;
                const maxAttempts = 50;
                
                const checkMount = setInterval(() => {
                    attempts++;
                    const stripeElement = paymentElementContainer.querySelector('.StripeElement') || 
                                        paymentElementContainer.querySelector('[data-testid="payment-element"]') ||
                                        paymentElementContainer.querySelector('iframe') ||
                                        paymentElementContainer.querySelector('[class*="Stripe"]');
                    
                    if (stripeElement) {
                        clearInterval(checkMount);
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        clearInterval(checkMount);
                        reject(new Error('Payment element mount timeout'));
                    }
                }, 100);
            });
        }

        // Handle payment submission
        async function handlePaymentSubmit() {
            const submitBtn = document.getElementById('submitPaymentBtn');
            const submitText = document.getElementById('submitPaymentText');
            const submitSpinner = document.getElementById('submitPaymentSpinner');
            const errorDiv = document.getElementById('payment-errors');

            submitBtn.disabled = true;
            submitText.style.display = 'none';
            submitSpinner.style.display = 'inline';
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!stripe || !elements || !paymentElement) {
                errorDiv.textContent = 'Payment form not ready. Please refresh and try again.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
                return;
            }

            try {
                const { error: submitError } = await stripe.confirmPayment({
                    elements,
                    confirmParams: {
                        return_url: window.location.href,
                    },
                    redirect: 'if_required',
                });

                if (submitError) {
                    errorDiv.textContent = submitError.message;
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitText.style.display = 'inline';
                    submitSpinner.style.display = 'none';
                    return;
                }

                const token = localStorage.getItem('auth_token');
                const confirmResponse = await fetch(`${API_URL}/routes/confirm-payment`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        paymentIntentId: currentPaymentIntentId
                    })
                });

                if (confirmResponse.ok) {
                    alert('Payment successful! Your license is now active.');
                    hidePaywall();
                    await checkLicenseStatus();
                    await loadRoutes();
                } else {
                    const error = await confirmResponse.json();
                    throw new Error(error.error || 'Failed to confirm payment');
                }
            } catch (err) {
                console.error('Payment error:', err);
                errorDiv.textContent = err.message || 'Payment failed. Please try again.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
            }
        }

        async function initiatePurchase() {
            const token = localStorage.getItem('auth_token');
            if (!token) {
                alert('Please log in to purchase');
                window.location.href = 'login.html';
                return;
            }

            const btn = document.getElementById('purchaseBtn');
            btn.disabled = true;
            btn.textContent = 'Loading...';

            try {
                const response = await fetch(`${API_URL}/routes/create-payment-intent`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    if (!data.clientSecret) {
                        throw new Error('No client secret received from server');
                    }
                    
                    currentPaymentIntentId = data.paymentIntentId;
                    await setupPaymentForm(data.clientSecret);
                    btn.disabled = false;
                    btn.textContent = 'Buy 3-Month Access';
                } else {
                    const error = await response.json().catch(() => ({ error: 'Unknown error' }));
                    alert(`Payment Error: ${error.details || error.error || 'Failed to start payment'}`);
                    btn.disabled = false;
                    btn.textContent = 'Buy 3-Month Access';
                }
            } catch (err) {
                console.error('Error initiating purchase:', err);
                alert(err.message || 'Failed to start payment. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Buy 3-Month Access';
            }
        }

        function resetPaymentForm() {
            if (paymentElement) {
                try {
                    paymentElement.unmount();
                } catch (e) {}
                paymentElement = null;
            }
            elements = null;
            currentPaymentIntentId = null;
            document.getElementById('paymentForm').style.display = 'none';
            document.getElementById('purchaseButtonContainer').style.display = 'block';
            document.getElementById('payment-errors').style.display = 'none';
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', async () => {
            await checkLicenseStatus();
            
            // If no license, redirect to payment
            if (!hasLicense) {
                const wantsUpgrade = confirm(
                    'You need a 3-month license to access Naas route details.\n\n' +
                    'Would you like to upgrade to unlock all driving test routes?'
                );
                
                if (wantsUpgrade) {
                    window.location.href = 'payment.html';
                    return;
                } else {
                    window.location.href = 'routes.html';
                    return;
                }
            }
            
            // User has premium access - load routes
            await loadRoutes();
        });

        async function loadRoutes() {
            const loadingContainer = document.getElementById('loadingContainer');
            const routesContainer = document.getElementById('routesContainer');
            const errorContainer = document.getElementById('errorContainer');
            const expiryInfo = document.getElementById('expiryInfo');

            try {
                // Generate access token
                const tokenResponse = await fetch(`${API_URL}/routes/generate-naas-token`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!tokenResponse.ok) {
                    const error = await tokenResponse.json();
                    if (error.error && error.error.includes('license')) {
                        // Check license status and show paywall
                        await checkLicenseStatus();
                        if (!hasLicense) {
                            showPaywall();
                        }
                        errorContainer.innerHTML = `
                            <div class="error">
                                <strong>Access Required</strong><br>
                                You need an active license to view Naas routes.
                            </div>
                        `;
                    } else {
                        errorContainer.innerHTML = `
                            <div class="error">
                                <strong>Error</strong><br>
                                ${error.error || 'Failed to generate access token'}
                            </div>
                        `;
                    }
                    loadingContainer.style.display = 'none';
                    return;
                }

                const tokenData = await tokenResponse.json();
                accessToken = tokenData.accessToken;
                tokenExpiresAt = new Date(tokenData.expiresAt);

                // Update expiry info
                const expiryTime = new Date(tokenExpiresAt).toLocaleTimeString();
                expiryInfo.textContent = `Access expires at ${expiryTime}`;
                expiryInfo.style.display = 'block';

                // Fetch route data
                const dataResponse = await fetch(`${API_URL}/routes/naas-data/${accessToken}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!dataResponse.ok) {
                    const error = await dataResponse.json();
                    throw new Error(error.error || 'Failed to load routes');
                }

                routesData = await dataResponse.json();
                displayRoutes(routesData);

                loadingContainer.style.display = 'none';
            } catch (err) {
                console.error('Error loading routes:', err);
                errorContainer.innerHTML = `
                    <div class="error">
                        <strong>Error</strong><br>
                        ${err.message || 'Failed to load routes. Please try again.'}
                    </div>
                `;
                loadingContainer.style.display = 'none';
            }
        }

        function displayRoutes(data) {
            const routesContainer = document.getElementById('routesContainer');
            
            if (!data.routes || data.routes.length === 0) {
                routesContainer.innerHTML = '<div class="loading">No routes available</div>';
                return;
            }

            routesContainer.innerHTML = data.routes.map(route => `
                <div class="route-card">
                    <h3>${route.name}</h3>
                    <button class="route-btn" onclick="openRoute(${route.id})">
                        View Route on Google Maps
                    </button>
                </div>
            `).join('');
        }

        function openRoute(routeId) {
            if (!accessToken) {
                alert('Access token not available. Please refresh the page.');
                return;
            }

            // Check if token is still valid
            if (new Date() > tokenExpiresAt) {
                alert('Your access has expired. Please refresh the page to get a new token.');
                return;
            }

            // Redirect through proxy endpoint - link never exposed in frontend
            window.location.href = `${API_URL}/routes/naas-route/${accessToken}/${routeId}`;
        }

        // Update expiry countdown
        setInterval(() => {
            if (tokenExpiresAt && new Date() > tokenExpiresAt) {
                const expiryInfo = document.getElementById('expiryInfo');
                expiryInfo.innerHTML = '<strong>Access expired</strong> - Please refresh the page';
                expiryInfo.style.background = 'rgba(239, 68, 68, 0.1)';
                expiryInfo.style.borderColor = 'rgba(239, 68, 68, 0.3)';
            }
        }, 1000);

        // Paywall modal handlers
        document.getElementById('purchaseBtn').addEventListener('click', initiatePurchase);
        document.getElementById('closePaywallBtn').addEventListener('click', () => {
            resetPaymentForm();
            hidePaywall();
        });
        document.getElementById('backToPurchaseBtn').addEventListener('click', () => {
            resetPaymentForm();
        });
        document.getElementById('submitPaymentBtn').addEventListener('click', handlePaymentSubmit);
        document.getElementById('paywallModal').addEventListener('click', (e) => {
            if (e.target.id === 'paywallModal') {
                resetPaymentForm();
                hidePaywall();
            }
        });
    </script>
</body>
</html>
