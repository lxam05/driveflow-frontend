<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naas Test Routes | DriveFlow</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-elevated: #1c2541;
        --bg-card: #2d3f5a;
        --bg-card-soft: #2d3f5a;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --border-strong: rgba(111, 255, 233, 0.7);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        max-width: 1200px;
        margin: 96px auto 40px;
        padding: 0 20px 40px;
    }

    .page-header {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 40px;
        text-align: center;
    }

    .page-header h1 {
        margin: 0 0 12px;
        color: var(--text-main);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
    }

    .routes-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
        margin-top: 24px;
    }

    .route-card {
        padding: 24px;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        transition: all 0.2s ease;
    }

    .route-card:hover {
        background: var(--primary-soft);
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(91, 192, 190, 0.3);
    }

    .route-card h3 {
        margin: 0 0 16px;
        font-size: 20px;
        font-weight: 700;
        color: var(--text-main);
    }

    .route-btn {
        width: 100%;
        padding: 12px 24px;
        background: var(--primary);
        color: var(--bg-main);
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .route-btn:hover {
        background: var(--accent);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(111, 255, 233, 0.4);
    }

    .route-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
    }

    .error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin: 20px 0;
        color: #ef4444;
    }

    .expiry-info {
        background: var(--primary-soft);
        border: 1px solid var(--primary);
        border-radius: var(--radius-lg);
        padding: 16px;
        margin-bottom: 24px;
        text-align: center;
        color: var(--text-main);
        font-size: 14px;
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.18s ease-out;
    }

    .btn-back:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
        border-color: rgba(129, 140, 248, 0.8);
    }
</style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Naas Test Routes</h1>
            <p>Access detailed route information for the Naas test centre</p>
        </div>

        <div id="errorContainer"></div>
        <div id="expiryInfo" class="expiry-info" style="display: none;"></div>
        <div id="routesContainer" class="routes-container"></div>
        <div id="loadingContainer" class="loading">Loading routes...</div>

        <a href="routes.html" class="btn-back">← Back to All Routes</a>
    </div>

    <script>
        const API_URL = 'https://driving-test-backend-production.up.railway.app';
        
        let accessToken = null;
        let routesData = null;
        let tokenExpiresAt = null;

        // Get token from localStorage
        const token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', async () => {
            await loadRoutes();
        });

        async function loadRoutes() {
            const loadingContainer = document.getElementById('loadingContainer');
            const routesContainer = document.getElementById('routesContainer');
            const errorContainer = document.getElementById('errorContainer');
            const expiryInfo = document.getElementById('expiryInfo');

            try {
                // Generate access token
                const tokenResponse = await fetch(`${API_URL}/routes/generate-naas-token`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!tokenResponse.ok) {
                    const error = await tokenResponse.json();
                    if (error.error && error.error.includes('license')) {
                        errorContainer.innerHTML = `
                            <div class="error">
                                <strong>Access Required</strong><br>
                                You need an active license to view Naas routes. 
                                <a href="routes.html" style="color: var(--primary); text-decoration: underline;">Purchase access here</a>
                            </div>
                        `;
                    } else {
                        errorContainer.innerHTML = `
                            <div class="error">
                                <strong>Error</strong><br>
                                ${error.error || 'Failed to generate access token'}
                            </div>
                        `;
                    }
                    loadingContainer.style.display = 'none';
                    return;
                }

                const tokenData = await tokenResponse.json();
                accessToken = tokenData.accessToken;
                tokenExpiresAt = new Date(tokenData.expiresAt);

                // Update expiry info
                const expiryTime = new Date(tokenExpiresAt).toLocaleTimeString();
                expiryInfo.textContent = `Access expires at ${expiryTime}`;
                expiryInfo.style.display = 'block';

                // Fetch route data
                const dataResponse = await fetch(`${API_URL}/routes/naas-data/${accessToken}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!dataResponse.ok) {
                    const error = await dataResponse.json();
                    throw new Error(error.error || 'Failed to load routes');
                }

                routesData = await dataResponse.json();
                displayRoutes(routesData);

                loadingContainer.style.display = 'none';
            } catch (err) {
                console.error('Error loading routes:', err);
                errorContainer.innerHTML = `
                    <div class="error">
                        <strong>Error</strong><br>
                        ${err.message || 'Failed to load routes. Please try again.'}
                    </div>
                `;
                loadingContainer.style.display = 'none';
            }
        }

        function displayRoutes(data) {
            const routesContainer = document.getElementById('routesContainer');
            
            if (!data.routes || data.routes.length === 0) {
                routesContainer.innerHTML = '<div class="loading">No routes available</div>';
                return;
            }

            routesContainer.innerHTML = data.routes.map(route => `
                <div class="route-card">
                    <h3>${route.name}</h3>
                    <button class="route-btn" onclick="openRoute(${route.id})">
                        View Route on Google Maps
                    </button>
                </div>
            `).join('');
        }

        function openRoute(routeId) {
            if (!accessToken) {
                alert('Access token not available. Please refresh the page.');
                return;
            }

            // Check if token is still valid
            if (new Date() > tokenExpiresAt) {
                alert('Your access has expired. Please refresh the page to get a new token.');
                return;
            }

            // Redirect through proxy endpoint - link never exposed in frontend
            window.location.href = `${API_URL}/routes/naas-route/${accessToken}/${routeId}`;
        }

        // Update expiry countdown
        setInterval(() => {
            if (tokenExpiresAt && new Date() > tokenExpiresAt) {
                const expiryInfo = document.getElementById('expiryInfo');
                expiryInfo.innerHTML = '<strong>Access expired</strong> - Please refresh the page';
                expiryInfo.style.background = 'rgba(239, 68, 68, 0.1)';
                expiryInfo.style.borderColor = 'rgba(239, 68, 68, 0.3)';
            }
        }, 1000);
    </script>
</body>
</html>
