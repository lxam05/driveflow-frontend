<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="description" content="Real Naas driving test routes mapped for Google Maps. Learn the actual test course before your exam.">
<link rel="canonical" href="https://www.driveflow.ie/naas-routes.html">
<link rel="icon" href="https://www.driveflow.ie/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="https://www.driveflow.ie/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://www.driveflow.ie/favicon.png">
<link rel="apple-touch-icon" href="https://www.driveflow.ie/favicon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Naas Routes — DriveFlow | Real Driving Test Routes</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
        --bg-main: #0b132b;
        --bg-elevated: #1c2541;
        --bg-card: #2d3f5a;
        --bg-card-soft: #2d3f5a;
        --border-subtle: rgba(91, 192, 190, 0.22);
        --border-strong: rgba(111, 255, 233, 0.7);
        --primary: #5bc0be;
        --primary-soft: rgba(91, 192, 190, 0.18);
        --accent: #6fffe9;
        --accent-soft: rgba(111, 255, 233, 0.18);
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --shadow-card: 0 18px 60px rgba(0, 0, 0, 0.6);
        --radius-lg: 22px;
        --radius-xl: 26px;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        overflow-x: hidden;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        max-width: 1200px;
        margin: 96px auto 40px;
        padding: 0 20px 40px;
    }

    .page-header {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-card);
        padding: 40px;
        margin-bottom: 40px;
        text-align: center;
    }

    .page-header h1 {
        margin: 0 0 12px;
        color: var(--text-main);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
    }

    .routes-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
        margin-top: 24px;
    }

    .route-card {
        padding: 24px;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        transition: all 0.2s ease;
    }

    .route-card:hover {
        background: var(--primary-soft);
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(91, 192, 190, 0.3);
    }

    .route-card h3 {
        margin: 0 0 16px;
        font-size: 20px;
        font-weight: 700;
        color: var(--text-main);
    }

    .route-btn {
        width: 100%;
        padding: 12px 24px;
        background: var(--primary);
        color: var(--bg-main);
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .route-btn:hover {
        background: var(--accent);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(111, 255, 233, 0.4);
    }

    .route-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
    }

    .error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin: 20px 0;
        color: #ef4444;
    }

    .expiry-info {
        background: var(--primary-soft);
        border: 1px solid var(--primary);
        border-radius: var(--radius-lg);
        padding: 16px;
        margin-bottom: 24px;
        text-align: center;
        color: var(--text-main);
        font-size: 14px;
    }

    .btn-back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.18s ease-out;
    }

    .btn-back:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
        border-color: rgba(129, 140, 248, 0.8);
    }

    /* Paywall Modal */
    .paywall-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .paywall-modal.show {
        display: flex;
    }

    .paywall-content {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-xl);
        padding: 40px;
        max-width: 500px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        text-align: center;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
    }
    
    .paywall-content::-webkit-scrollbar {
        width: 8px;
    }
    
    .paywall-content::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.3);
        border-radius: 4px;
    }
    
    .paywall-content::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 4px;
    }
    
    .paywall-content::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
    }

    .paywall-content h2 {
        margin: 0 0 16px;
        color: var(--text-main);
        font-size: 24px;
        font-weight: 700;
    }

    .paywall-content p {
        margin: 0 0 24px;
        color: var(--text-muted);
        line-height: 1.6;
    }

    .btn-purchase {
        padding: 14px 32px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(120deg, rgba(37, 99, 235, 0.95), rgba(124, 58, 237, 0.95));
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 8px 24px rgba(30, 64, 175, 0.4);
    }

    .btn-purchase:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(30, 64, 175, 0.6);
    }

    .btn-purchase:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .license-status {
        padding: 12px 20px;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 12px;
        margin-bottom: 20px;
        font-size: 14px;
        color: #bbf7d0;
    }

    .license-status.expired {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.3);
        color: #fecaca;
    }

    /* Payment Form Styling */
    #payment-element {
        padding: 20px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        margin-bottom: 20px;
        min-height: 0;
        flex-shrink: 0;
    }
    
    #paymentForm {
        flex-shrink: 0;
        margin-top: 24px;
        display: flex;
        flex-direction: column;
    }
    
    #submitPaymentBtn {
        margin-top: 20px;
        flex-shrink: 0;
    }

    #payment-errors {
        padding: 12px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 8px;
        margin-bottom: 16px;
    }

    #submitPaymentBtn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #purchaseButtonContainer {
        display: block;
    }

    @media (max-width: 768px) {
        .container {
            margin: 20px auto 20px;
            padding: 0 16px 20px;
        }

        .page-header {
            padding: 24px 20px;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 24px;
        }

        .page-header p {
            font-size: 14px;
        }

        .routes-container {
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        .route-card {
            padding: 20px;
        }

        .btn-back {
            margin-top: 16px;
            padding: 8px 16px;
            font-size: 12px;
        }
    }
</style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Naas Test Routes</h1>
            <p>Access detailed route information for the Naas test centre</p>
        </div>

        <div id="errorContainer"></div>
        <div id="routesContainer" class="routes-container"></div>
        <div id="loadingContainer" class="loading">Loading routes...</div>

        <a href="routes.html" class="btn-back">← Back to All Routes</a>
    </div>

<!-- Paywall Modal -->
<!-- Paywall Modal removed - all payment functionality moved to payment.html -->

    <script>
        const API_URL = location.hostname === "localhost" || location.hostname === "127.0.0.1"
            ? "http://localhost:8080"
            : "https://driving-test-backend-production.up.railway.app";
        
        let accessToken = null;
        let routesData = null;
        let tokenExpiresAt = null;
        let hasLicense = false;
        let licenseExpiresAt = null;

        // Get token from localStorage
        const token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        // Check license status on page load
        async function checkLicenseStatus() {
            const token = localStorage.getItem('auth_token');
            if (!token) {
                hasLicense = false;
                return;
            }

            try {
                const response = await fetch(`${API_URL}/routes/license-status`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    hasLicense = data.hasLicense || false;
                    licenseExpiresAt = data.expiresAt;
                    
                    // Double-check expiry even if API says hasLicense is true
                    if (hasLicense && licenseExpiresAt) {
                        const expiryDate = new Date(licenseExpiresAt);
                        const now = new Date();
                        if (expiryDate < now) {
                            hasLicense = false;
                        }
                    }
                    
                    // Update UI (but don't let it modify hasLicense)
                    updateLicenseUI();
                } else {
                    // If API call fails, assume no license
                    hasLicense = false;
                }
            } catch (err) {
                console.error('Error checking license:', err);
                // On error, assume no license to be safe
                hasLicense = false;
            }
        }

        function updateLicenseUI() {
            const statusDiv = document.getElementById('licenseStatus');
            if (!statusDiv) {
                // Element doesn't exist, skip UI update
                return;
            }
            
            if (hasLicense && licenseExpiresAt) {
                const expiryDate = new Date(licenseExpiresAt);
                const isExpired = expiryDate < new Date();
                statusDiv.innerHTML = isExpired 
                    ? `<div class="license-status expired">Your license expired on ${expiryDate.toLocaleDateString()}</div>`
                    : `<div class="license-status">✓ Active license expires ${expiryDate.toLocaleDateString()}</div>`;
                statusDiv.style.display = 'block';
                // Don't modify hasLicense here - it's already set correctly in checkLicenseStatus
            } else {
                if (statusDiv) {
                    statusDiv.style.display = 'none';
                }
            }
        }

        // All payment functionality moved to payment.html - redirect immediately
        function showPaywall() {
            window.location.href = 'payment.html';
        }

        // All payment functionality removed - moved to payment.html

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', async () => {
            await checkLicenseStatus();
            
            // If no license, immediately redirect to payment (no confirm dialog)
            if (!hasLicense) {
                window.location.href = 'payment.html';
                return;
            }
            
            // User has premium access - load routes
            await loadRoutes();
        });

        async function loadRoutes() {
            const loadingContainer = document.getElementById('loadingContainer');
            const routesContainer = document.getElementById('routesContainer');
            const errorContainer = document.getElementById('errorContainer');

            try {
                // Generate access token
                const tokenResponse = await fetch(`${API_URL}/routes/generate-naas-token`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!tokenResponse.ok) {
                    const error = await tokenResponse.json();
                    if (error.error && error.error.includes('license')) {
                        // Check license status and show paywall
                        await checkLicenseStatus();
                        if (!hasLicense) {
                            window.location.href = 'payment.html';
                            return;
                        }
                        errorContainer.innerHTML = `
                            <div class="error">
                                <strong>Access Required</strong><br>
                                You need an active license to view Naas routes.
                            </div>
                        `;
                    } else {
                        errorContainer.innerHTML = `
                            <div class="error">
                                <strong>Error</strong><br>
                                ${error.error || 'Failed to generate access token'}
                            </div>
                        `;
                    }
                    loadingContainer.style.display = 'none';
                    return;
                }

                const tokenData = await tokenResponse.json();
                accessToken = tokenData.accessToken;
                tokenExpiresAt = new Date(tokenData.expiresAt);

                // Fetch route data
                const dataResponse = await fetch(`${API_URL}/routes/naas-data/${accessToken}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!dataResponse.ok) {
                    const error = await dataResponse.json();
                    throw new Error(error.error || 'Failed to load routes');
                }

                routesData = await dataResponse.json();
                displayRoutes(routesData);

                loadingContainer.style.display = 'none';
            } catch (err) {
                console.error('Error loading routes:', err);
                errorContainer.innerHTML = `
                    <div class="error">
                        <strong>Error</strong><br>
                        ${err.message || 'Failed to load routes. Please try again.'}
                    </div>
                `;
                loadingContainer.style.display = 'none';
            }
        }

        function displayRoutes(data) {
            const routesContainer = document.getElementById('routesContainer');
            
            if (!data.routes || data.routes.length === 0) {
                routesContainer.innerHTML = '<div class="loading">No routes available</div>';
                return;
            }

            routesContainer.innerHTML = data.routes.map((route, index) => `
                <div class="route-card">
                    <h3>Route ${index + 1}</h3>
                    <button class="route-btn" onclick="openRoute(${route.id})">
                        View Route ${index + 1} on Google Maps
                    </button>
                </div>
            `).join('');
        }

        function openRoute(routeId) {
            if (!accessToken) {
                alert('Access token not available. Please refresh the page.');
                return;
            }

            // Check if token is still valid
            if (new Date() > tokenExpiresAt) {
                alert('Your access has expired. Please refresh the page to get a new token.');
                return;
            }

            // Redirect through proxy endpoint - link never exposed in frontend
            window.location.href = `${API_URL}/routes/naas-route/${accessToken}/${routeId}`;
        }

        // No expiry text/countdown shown on this page; token expiry is enforced by the backend

        // Paywall modal handlers
        // All payment event listeners removed - payment functionality moved to payment.html
    </script>

      ]
    }
    </script>
</body>
</html>
