<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        --bg-main: #fafafa;

        --border-strong: #ddd;
        --primary: #1a1a1a;
        --primary-soft: rgba(26, 26, 26, 0.08);
        --accent: #e6b800;
        --accent-soft: rgba(230, 184, 0, 0.15);
        --accent-orange: #f97316;
        --accent-red: #ef4444;
        --text-main: #1a1a1a;
        --text-muted: #666;
        --text-soft: #555;

        --radius-xl: 26px;
        --blur: 18px;
        --button-bg: #1a1a1a;
        --primary-blue: #1a1a1a;
        --primary-blue-dark: #333;

        --bg-glass: rgba(255, 255, 255, 0.95);

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-main);
        background-image: var(--bg-main-pattern);
        background-size: 20px 20px;
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        backdrop-filter: blur(var(--blur)) saturate(160%);
        -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
        background: radial-gradient(circle at top left, rgba(30, 64, 175, 0.28), transparent 55%),
                    linear-gradient(90deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.96));
        border-bottom: 1px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.8);
        padding: 14px 20px;
    }

    .nav-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .brand-logo {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: radial-gradient(circle at 20% 20%, #4f46e5, #22c55e);

                    0 14px 35px rgba(15, 23, 42, 0.85);

    .brand-text h1 {
        margin: 0;

        background-clip: text;
        -webkit-text-fill-color: transparent;

    .auth-container {
        width: 100%;
        max-width: 440px;
        margin-top: 60px;
    }

    .auth-card {
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);

    }

    .auth-card h2 {
        font-size: 26px;
        font-weight: 800;
        margin: 0 0 8px;
    }

    .auth-card p {
        color: var(--text-muted);
        margin: 0 0 24px;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
    }

    input {
        width: 100%;
        padding: 14px 16px;
        font-size: 15px;
        border: 1px solid var(--border-subtle);
        border-radius: 18px;

        color: var(--text-main);
    }

    button {
        width: 100%;
        padding: 14px 16px;
        border-radius: 18px;
        border: none;
        background: var(--accent);
        color: #0b132b;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
    }

    .message {
        display: none;
        margin-bottom: 16px;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 13px;
    }

    .message.show {
        display: block;
    }

    .message.error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.5);
        color: #fecaca;
    }

    .message.success {
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.5);

    }

<body>
<header>
    <div class="nav-inner">
        <div class="brand">
            <div class="brand-logo"></div>
            <div class="brand-text">
                <h1>DriveFlow</h1>
            </div>
        </div>
    </div>
</header>

<div class="auth-container">
    <div class="auth-card">
        <h2>Set a new password</h2>
        <p>Choose a new password for your account.</p>

        <div class="message error" id="errorMessage"></div>
        <div class="message success" id="successMessage"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
            </div>
            <button type="submit" id="submitBtn">Update password</button>
        </form>
    </div>
</div>

<script>
    const API_URL =
    location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "http://localhost:8080"
        : "https://driving-test-backend-production.up.railway.app";

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const resetForm = document.getElementById('resetForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add('show');
        successMessage.classList.remove('show');
    }

    function showSuccess(message) {
        successMessage.textContent = message;
        successMessage.classList.add('show');
        errorMessage.classList.remove('show');
    }

    if (!token) {
        showError('Invalid reset link. Please request a new one.');
        resetForm.style.display = 'none';
    }

    resetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!token) return;

        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password.length < 6) {
            showError('Password must be at least 6 characters.');
            return;
        }

        if (password !== confirmPassword) {
            showError('Passwords do not match.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';

        try {
            const response = await fetch(`${API_URL}/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ token, newPassword: password })
            });

            const data = await response.json();
            if (!response.ok) {
                showError(data.error || 'Failed to reset password.');
            } else {
                showSuccess('Password updated. Redirecting to login...');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);
            }
        } catch (err) {
            showError('Cannot reach server.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Update password';
        }
    });
</script>

<script src="/chatbot-widget.js"></script>
</body>
